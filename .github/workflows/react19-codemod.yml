name: React 19 One-Shot Codemod

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  codemod:
    if: ${{ !contains(github.event.pull_request.title, '[react19-codemod-skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Apply exact React 19 transforms
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} exact matches, found {found}')
              p.write_text(text.replace(old, new, count))

          replace('components/effects/NeuronCursor.tsx', "    setSnapshot((current) => ({ ...current, enabled: true }));\n\n", "")

          replace('components/ideas/IdeaLandscape.tsx', "import { ResearchIdea } from '@/data/research-ideas';\n", "import { ResearchIdea } from '@/data/research-ideas';\nimport { useMediaQuery } from '@/lib/hooks/useBrowserState';\n")
          replace('components/ideas/IdeaLandscape.tsx', "  const [prefersReducedMotion, setPrefersReducedMotion] = useState(false);\n", "  const prefersReducedMotion = useMediaQuery('(prefers-reduced-motion: reduce)');\n")
          replace('components/ideas/IdeaLandscape.tsx', "  useEffect(() => {\n    const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');\n    setPrefersReducedMotion(mediaQuery.matches);\n    const handler = (e: MediaQueryListEvent) => setPrefersReducedMotion(e.matches);\n    mediaQuery.addEventListener('change', handler);\n    return () => mediaQuery.removeEventListener('change', handler);\n  }, []);\n\n", "")

          replace('components/neural-atlas/NeuralGraphHome.tsx', "import type { AtlasCategoryId, NeuralAtlasNode } from './registry';\n", "import type { AtlasCategoryId, NeuralAtlasNode } from './registry';\nimport { useMediaQuery } from '@/lib/hooks/useBrowserState';\n")
          replace('components/neural-atlas/NeuralGraphHome.tsx', "function useReducedMotionPreference() {\n  const [reduced, setReduced] = useState(false);\n\n  useEffect(() => {\n    const query = window.matchMedia('(prefers-reduced-motion: reduce)');\n    setReduced(query.matches);\n    const onChange = () => setReduced(query.matches);\n    query.addEventListener('change', onChange);\n    return () => query.removeEventListener('change', onChange);\n  }, []);\n\n  return reduced;\n}\n\n", "")
          replace('components/neural-atlas/NeuralGraphHome.tsx', "  const reducedMotion = useReducedMotionPreference();\n", "  const reducedMotion = useMediaQuery('(prefers-reduced-motion: reduce)');\n")

          replace('components/perceptual-cortex/PerceptualCortexExperience.tsx', "  const [soundscapeActive, setSoundscapeActive] = useState(false);\n  const replayStarted = useRef(0);\n", "  const [soundscapeActive, setSoundscapeActive] = useState(false);\n  const [microscopeStats, setMicroscopeStats] = useState({ handsCount: 0, pinch: 0, audioRms: 0, replayCount: 0 });\n  const replayStarted = useRef(0);\n")
          replace('components/perceptual-cortex/PerceptualCortexExperience.tsx', "  useEffect(() => {\n    const media = matchMedia('(prefers-reduced-motion: reduce)');\n    setReducedMotion(media.matches);\n    const memory = (navigator as Navigator & { deviceMemory?: number }).deviceMemory;\n    setQuality(initialQuality(innerWidth, memory));\n  }, [setReducedMotion]);\n", "  useEffect(() => {\n    const frame = requestAnimationFrame(() => {\n      const media = matchMedia('(prefers-reduced-motion: reduce)');\n      setReducedMotion(media.matches);\n      const memory = (navigator as Navigator & { deviceMemory?: number }).deviceMemory;\n      setQuality(initialQuality(innerWidth, memory));\n    });\n    return () => cancelAnimationFrame(frame);\n  }, [setReducedMotion]);\n")
          replace('components/perceptual-cortex/PerceptualCortexExperience.tsx', "      if (started && now - lastUiUpdate >= 1000) { setElapsed(now - started); if (frameCount) setQuality((current) => adaptQuality(current, frameTotal / frameCount)); frameTotal = 0; frameCount = 0; lastUiUpdate = now; }\n", "      if (started && now - lastUiUpdate >= 1000) { setElapsed(now - started); setMicroscopeStats({ handsCount: input.current.hands.count, pinch: input.current.hands.pinch, audioRms: input.current.audio.smoothedRms, replayCount: recorder.current.snapshot().length }); if (frameCount) setQuality((current) => adaptQuality(current, frameTotal / frameCount)); frameTotal = 0; frameCount = 0; lastUiUpdate = now; }\n")
          replace('components/perceptual-cortex/PerceptualCortexExperience.tsx', "{input.current.hands.count} / {world.handSpeed.toFixed(2)}", "{microscopeStats.handsCount} / {world.handSpeed.toFixed(2)}")
          replace('components/perceptual-cortex/PerceptualCortexExperience.tsx', "{input.current.hands.pinch.toFixed(2)} / {world.handSeparation.toFixed(2)}", "{microscopeStats.pinch.toFixed(2)} / {world.handSeparation.toFixed(2)}")
          replace('components/perceptual-cortex/PerceptualCortexExperience.tsx', "{input.current.audio.smoothedRms.toFixed(3)}", "{microscopeStats.audioRms.toFixed(3)}")
          replace('components/perceptual-cortex/PerceptualCortexExperience.tsx', "{Math.floor(elapsed / 1000)}s / {recorder.current.snapshot().length}", "{Math.floor(elapsed / 1000)}s / {microscopeStats.replayCount}")

          replace('components/physiology/NatureWorldRenderer.tsx', "function StylizedWildlife({ world }: { world: RichNatureWorldDefinition }) {\n  if (world.wildlife.length === 0) return null;\n  const label = world.wildlife[0];\n  const aquatic = /fish|whale|shark|squid|octopus|otter|seal/.test(label);\n  const bird = /bird|raptor|macaw|owl|swan|duck|flamingo/.test(label);\n  const insect = /insect/.test(label);\n  const reptile = /snake|crocod|turtle/.test(label);\n  const group = useRef<Group>(null);\n  useFrame(({ clock }) => {\n    if (!group.current) return;\n    const t = clock.getElapsedTime();\n    group.current.position.y = (aquatic ? -0.05 : 0.05) + Math.sin(t * (bird ? 1.1 : insect ? 2.2 : 0.75) + world.seed) * (bird ? 0.18 : insect ? 0.1 : 0.035);\n    group.current.position.x = Math.sin(t * 0.22 + world.seed) * (bird ? 0.5 : 0.12);\n  });\n  const palette = NATURE_WORLD_PALETTES[world.palette];\n", "function StylizedWildlife({ world }: { world: RichNatureWorldDefinition }) {\n  const label = world.wildlife[0] ?? '';\n  const aquatic = /fish|whale|shark|squid|octopus|otter|seal/.test(label);\n  const bird = /bird|raptor|macaw|owl|swan|duck|flamingo/.test(label);\n  const insect = /insect/.test(label);\n  const reptile = /snake|crocod|turtle/.test(label);\n  const group = useRef<Group>(null);\n  useFrame(({ clock }) => {\n    if (!group.current || !label) return;\n    const t = clock.getElapsedTime();\n    group.current.position.y = (aquatic ? -0.05 : 0.05) + Math.sin(t * (bird ? 1.1 : insect ? 2.2 : 0.75) + world.seed) * (bird ? 0.18 : insect ? 0.1 : 0.035);\n    group.current.position.x = Math.sin(t * 0.22 + world.seed) * (bird ? 0.5 : 0.12);\n  });\n  if (!label) return null;\n  const palette = NATURE_WORLD_PALETTES[world.palette];\n")

          replace('components/physiology/PhysioPersonaAtlasLab.tsx', "  const startedAt = useRef(Date.now());\n", "  const startedAt = useRef(0);\n")
          replace('components/physiology/PhysioPersonaAtlasLab.tsx', "    const update = () => setSnapshot(createDemoPersonaSnapshot((Date.now() - startedAt.current) / 1000));\n", "    const update = () => { if (startedAt.current === 0) startedAt.current = Date.now(); setSnapshot(createDemoPersonaSnapshot((Date.now() - startedAt.current) / 1000)); };\n")

          replace('components/physiology/world3d/WorldLoom3DScene.tsx', "      renderer.xr.enabled = true;\n", "")

          Path('.github/workflows/react19-codemod.yml').unlink()
          PY

      - name: Validate codemod before commit
        run: |
          npm ci
          npm run typecheck
          npm run lint

      - name: Commit transformed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish React 19 correctness cleanup [react19-codemod]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
