name: Unicorn Stampede showcase integration

on:
  pull_request:
    paths:
      - 'app/game-runtimes/unicorn-stampede/**'
      - 'src/data/arcadeGames.ts'
      - 'scripts/playtest-unicorn-stampede-showcase.mjs'
      - 'tests/arcade-discovery.test.ts'
      - '.github/workflows/unicorn-stampede-showcase-pr.yml'

permissions:
  contents: read

jobs:
  qualify-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck runtime integration
        run: npm run typecheck
      - name: Unit contracts
        run: npx tsx --test tests/arcade-discovery.test.ts
      - name: Build production site
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_WORLD_LOOM_XR: disabled
        run: npm run build
      - name: Start site
        run: |
          npx next start -p 3000 > /tmp/showcase-site.log 2>&1 &
          for attempt in {1..40}; do
            curl -fsS http://127.0.0.1:3000/arcade/unicorn-stampede >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/showcase-site.log
          exit 1
      - name: Verify multi-file live-main proxy
        run: |
          curl -fsS -D /tmp/stampede-index.headers http://127.0.0.1:3000/game-runtimes/unicorn-stampede/index.html -o /tmp/stampede-index.html
          grep -qi 'Showcase Edition' /tmp/stampede-index.html
          grep -qi '^x-unicorn-stampede-source-ref: main' /tmp/stampede-index.headers
          grep -qi '^x-unicorn-stampede-source-asset: index.html' /tmp/stampede-index.headers
          for asset in src/showcase.css src/showcase-world-motion.js src/showcase-settings.js src/showcase-audio.js src/showcase-input.js src/showcase-stats.js src/showcase-shell.js; do
            curl -fsS "http://127.0.0.1:3000/game-runtimes/unicorn-stampede/$asset" >/dev/null
          done
      - name: Install browser matrix
        run: |
          rm -rf /tmp/showcase-playwright
          npm install --prefix /tmp/showcase-playwright --no-package-lock --no-save playwright@1.55.0
          /tmp/showcase-playwright/node_modules/.bin/playwright install --with-deps chromium firefox webkit
          /tmp/showcase-playwright/node_modules/.bin/playwright install chrome
      - name: Playtest website cabinet in four engines
        env:
          PLAYWRIGHT_MODULE_ROOT: /tmp/showcase-playwright/node_modules/playwright
          ARCADE_BROWSER_DIR: artifacts/unicorn-stampede-showcase
        run: node scripts/playtest-unicorn-stampede-showcase.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unicorn-stampede-showcase-browser-audit
          path: artifacts/unicorn-stampede-showcase
          if-no-files-found: warn
          retention-days: 14
