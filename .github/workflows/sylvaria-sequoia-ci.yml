name: Sylvaria Sequoia v0.5 CI

on:
  pull_request:
    paths:
      - '.github/workflows/sylvaria-sequoia-ci.yml'
      - 'app/arcade/**'
      - 'components/arcade/**'
      - 'src/data/arcadeGames.ts'
      - 'public/game-runtimes/sylvaria-sequoia/**'
      - 'docs/SYLVARIA_SEQUOIA_V05_LIVING_CANOPY.md'
      - 'scripts/validate-sylvaria-flow-envelope.mjs'
      - 'scripts/validate-sylvaria-heartwood.mjs'
      - 'scripts/validate-sylvaria-living-canopy.mjs'
      - 'scripts/playtest-sylvaria-shift-hold.mjs'
      - 'scripts/playtest-sylvaria-heartwood.mjs'
      - 'scripts/playtest-sylvaria-living-canopy-v2.mjs'
      - 'tests/arcade-discovery.test.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sylvaria-sequoia-v05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  living-canopy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Typecheck current website integration
        run: npm run typecheck

      - name: Run complete repository unit suite
        run: npm test

      - name: Validate preserved movement and Sap envelope
        run: npm run check:sylvaria-flow

      - name: Validate Heartwood Crown progression
        run: npm run check:sylvaria-heartwood

      - name: Validate Living Canopy progression and setpieces
        run: npm run check:sylvaria-living-canopy

      - name: Build production website
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_WORLD_LOOM_XR: disabled
        run: npm run build

      - name: Start built website
        run: |
          npx next start -p 3000 > /tmp/sylvaria-v05-site.log 2>&1 &
          echo $! > /tmp/sylvaria-v05-site.pid
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/arcade/sylvaria-sequoia >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sylvaria-v05-site.log
          exit 1

      - name: Smoke v0.5 cabinet and runtime assets
        run: |
          set -euo pipefail
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/arcade/sylvaria-sequoia | grep -q 'Sylvaria'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/sylvaria-sequoia/index.html | grep -q 'Sylvaria: Sequoia v0.5.0'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/sylvaria-sequoia/02-heartwood-quest.js | grep -q 'FINAL_CROWN_FLOOR = 250'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/sylvaria-sequoia/02-canopy-trials.js | grep -q 'THUNDERCROWN'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/sylvaria-sequoia/02-living-canopy.js | grep -q 'SKYHEART_FLOOR = 360'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/sylvaria-sequoia/02-living-canopy.js | grep -q 'WIND CHOIR'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/sylvaria-sequoia/02-living-canopy.js | grep -q 'ECHOFLIGHT'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/sylvaria-sequoia/03-living-canopy-render.js | grep -q 'living-canopy-render-v1'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/sylvaria-sequoia/03-living-objective-hud.js | grep -q 'scoreIsSecondary: true'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/sylvaria-sequoia/05-debug-living-canopy.js | grep -q "debug.version = '0.5.0'"

      - name: Install browser engines
        run: |
          rm -rf /tmp/sylvaria-v05-playwright
          npm install --prefix /tmp/sylvaria-v05-playwright --no-package-lock --no-save playwright@1.55.0
          /tmp/sylvaria-v05-playwright/node_modules/.bin/playwright install --with-deps chromium firefox webkit
          /tmp/sylvaria-v05-playwright/node_modules/.bin/playwright install chrome

      - name: Validate one-button Sap and movement input across four engines
        env:
          PLAYWRIGHT_MODULE_ROOT: /tmp/sylvaria-v05-playwright/node_modules/playwright
          SYLVARIA_SHIFT_BROWSER_DIR: artifacts/sylvaria-sequoia-shift-hold
        run: node scripts/playtest-sylvaria-shift-hold.mjs

      - name: Validate Heartwood Crown and canopy trials across four engines
        env:
          PLAYWRIGHT_MODULE_ROOT: /tmp/sylvaria-v05-playwright/node_modules/playwright
          SYLVARIA_HEARTWOOD_BROWSER_DIR: artifacts/sylvaria-sequoia-heartwood
        run: node scripts/playtest-sylvaria-heartwood.mjs

      - name: Validate Living Canopy Wonders and Skyheart across four engines
        env:
          PLAYWRIGHT_MODULE_ROOT: /tmp/sylvaria-v05-playwright/node_modules/playwright
          SYLVARIA_LIVING_BROWSER_DIR: artifacts/sylvaria-sequoia-living-canopy
        run: node scripts/playtest-sylvaria-living-canopy-v2.mjs

      - name: Upload Sylvaria v0.5 browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sylvaria-sequoia-v05-browser-evidence
          path: |
            artifacts/sylvaria-sequoia-shift-hold
            artifacts/sylvaria-sequoia-heartwood
            artifacts/sylvaria-sequoia-living-canopy
          if-no-files-found: warn
          retention-days: 14
