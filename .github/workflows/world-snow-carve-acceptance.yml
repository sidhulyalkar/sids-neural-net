name: Ski Snow-Contact Opt-in Qualification
on:
  pull_request:
    paths:
      - "lib/world/ski/simulation.ts"
      - "components/world/worldRenderer.ts"
      - "tests/world-ski-snow-experiment.test.ts"
      - ".github/workflows/world-snow-carve-acceptance.yml"
  workflow_dispatch:
jobs:
  snow-contact-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: baseline
            ski_v3: "1"
            snow: "0"
          - profile: snow
            ski_v3: "1"
            snow: "1"
          - profile: legacy
            ski_v3: "0"
            snow: "1"
    env:
      NEXT_PUBLIC_SKI_V3: ${{ matrix.ski_v3 }}
      NEXT_PUBLIC_SKI_SNOW_CARVE_EXPERIMENT: ${{ matrix.snow }}
      WORLD_BASE_URL: http://127.0.0.1:3000/world
      WORLD_AUDIT_DIR: artifacts/ski-snow-${{ matrix.profile }}
      PLAYWRIGHT_MODULE_ROOT: /tmp/world-snow-playwright/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Prove exact-head TypeScript compatibility
        run: npm run typecheck
      - name: Prove baseline parity, physical conservation and five real bank crossings
        run: |
          node --import tsx --test tests/world-ski-snow-experiment.test.ts tests/world-ski-ride.test.ts tests/world-ski-visual-sole.test.ts
      - name: Build island under selected exact profile
        run: npm run build
      - name: Install Chromium for both V3 and legacy browser evidence
        run: |
          npm install --prefix /tmp/world-snow-playwright --no-package-lock playwright@1.56.1
          /tmp/world-snow-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Start built exact-head island
        run: |
          npm run start -- -p 3000 > /tmp/world-snow.log 2>&1 &
          for i in $(seq 1 80); do
            if curl -fsS "$WORLD_BASE_URL" >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 100 /tmp/world-snow.log
          exit 1
      - name: Verify user-input V3, fallback and unarmed jump authorization
        run: |
          if [ "$NEXT_PUBLIC_SKI_V3" = "1" ]; then
            node scripts/playtest-ski-v3.mjs
          else
            node scripts/playtest-clean-mountain-halfpipe.mjs
          fi
      - name: Record exact tested SHA and selected feature switches
        if: always()
        run: |
          mkdir -p artifacts/ski-snow-${{ matrix.profile }}
          git rev-parse HEAD > artifacts/ski-snow-${{ matrix.profile }}/tested-sha.txt
          printf 'NEXT_PUBLIC_SKI_V3=%s\nNEXT_PUBLIC_SKI_SNOW_CARVE_EXPERIMENT=%s\n' "$NEXT_PUBLIC_SKI_V3" "$NEXT_PUBLIC_SKI_SNOW_CARVE_EXPERIMENT" > artifacts/ski-snow-${{ matrix.profile }}/flags.txt
          cp /tmp/world-snow.log artifacts/ski-snow-${{ matrix.profile }}/server.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ski-snow-${{ matrix.profile }}-${{ github.sha }}
          path: artifacts/ski-snow-${{ matrix.profile }}/
          if-no-files-found: warn
