name: Refresh Next.js security lockfile

on:
  push:
    branches:
      - feat/island-jetski-dock-race-v1
    paths:
      - package.json

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Generate canonical lockfile for patched Next.js
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact next@16.3.8 eslint-config-next@16.3.8
          node - <<'NODE'
          const fs=require("node:fs");
          const p=require("./package.json"),lock=require("./package-lock.json");
          for(const name of ["next","eslint-config-next"]){
            const wanted="16.3.8";
            const actual=p.dependencies?.[name]??p.devDependencies?.[name];
            if(actual!==wanted||lock.packages["node_modules/"+name]?.version!==wanted)
              throw new Error(name+" did not resolve to pinned 16.3.8");
          }
          const permitted=new Set(["package.json","package-lock.json"]);
          console.log("Pinned Next 16.3.8 and matching lock entries verified");
          NODE
          git diff --stat
      - name: Commit lockfile change only
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No lockfile drift"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Lock patched Next.js 16.3.8 and aligned ESLint config"
          git push origin HEAD:feat/island-jetski-dock-race-v1
