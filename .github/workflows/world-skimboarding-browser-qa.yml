name: North Shore Skimboarding Browser QA
on:
  push:
    branches: ['feat/sids-world']
    paths:
      - 'lib/world/skimboarding.ts'
      - 'lib/world/model.ts'
      - 'lib/world/biomes.ts'
      - 'components/world/**'
      - 'scripts/playtest-skimboarding.mjs'
      - '.github/workflows/world-skimboarding-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: north-shore-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skimboarding-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WORLD_BASE_URL: http://127.0.0.1:3000
      WORLD_AUDIT_DIR: artifacts/world/skimboarding
      PLAYWRIGHT_MODULE_ROOT: ${{ github.workspace }}/node_modules/playwright
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install exact website dependencies
        run: npm ci
      - name: Install Playwright and Chromium for independent scene rendering
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start World
        run: |
          (npm run dev > /tmp/world-skim-next.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              echo "World ready"; exit 0
            fi
            sleep 2
          done
          cat /tmp/world-skim-next.log
          exit 1
      - name: Audit north-shore interactions and capture screenshots
        run: node scripts/playtest-skimboarding.mjs
      - name: Upload desktop/mobile screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skimboarding-browser-${{ github.sha }}
          path: |
            artifacts/world/skimboarding/
            /tmp/world-skim-next.log
          if-no-files-found: warn
