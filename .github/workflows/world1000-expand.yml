name: One-Shot Nature Atlas 1000 Migration

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/xr-react-visual-arcade'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Apply exact 1000-world migration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} exact matches, found {found}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count))

          atlas = 'lib/physiology/natureWorldsExpanded.ts'
          replace(
              atlas,
              "} from './natureWorlds';\n",
              "} from './natureWorlds';\nimport { NATURE_WORLDS_901_1000 } from './natureWorlds1000Extension';\n",
          )
          replace(
              atlas,
              ' * Worlds 101-900 are compiled from a compact, exact manifest into rich scene\n',
              ' * Worlds 101-1000 are compiled from compact, exact manifests into rich scene\n',
          )
          replace(
              atlas,
              "  | 'desert-boho'\n  | 'celestial';\n",
              "  | 'desert-boho'\n  | 'celestial'\n  | 'living-sanctuaries'\n  | 'geological-wonders';\n",
          )
          replace(
              atlas,
              "  { id: 'all', label: 'all worlds', icon: '🗺️', range: '001-900' },\n",
              "  { id: 'all', label: 'all worlds', icon: '🗺️', range: '001-1000' },\n",
          )
          replace(
              atlas,
              "  { id: 'celestial', label: 'celestial vistas', icon: '🌌', range: '851-900' },\n",
              "  { id: 'celestial', label: 'celestial vistas', icon: '🌌', range: '851-900' },\n  { id: 'living-sanctuaries', label: 'living sanctuaries', icon: '🫶', range: '901-950' },\n  { id: 'geological-wonders', label: 'geological wonders', icon: '🪨', range: '951-1000' },\n",
          )
          replace(
              atlas,
              '  [900, "🌌", "shimmering red aurora glow", "celestial"],\n];\n',
              '  [900, "🌌", "shimmering red aurora glow", "celestial"],\n  ...NATURE_WORLDS_901_1000,\n];\n',
          )
          replace(
              atlas,
              "if (NATURE_WORLDS.length !== 900) {\n  throw new Error(`Nature atlas manifest invariant failed: expected 900 worlds, got ${NATURE_WORLDS.length}`);\n}\n",
              "if (NATURE_WORLDS.length !== 1000) {\n  throw new Error(`Nature atlas manifest invariant failed: expected 1000 worlds, got ${NATURE_WORLDS.length}`);\n}\n",
          )

          corpus = 'scripts/validate-nature-corpus.ts'
          replace(corpus, 'assert(NATURE_WORLDS.length === 900, `expected 900 worlds, found ${NATURE_WORLDS.length}`);', 'assert(NATURE_WORLDS.length === 1000, `expected 1000 worlds, found ${NATURE_WORLDS.length}`);')
          replace(corpus, "assert(new Set(NATURE_WORLDS.map((world) => world.id)).size === 900, 'world ids must be unique');", "assert(new Set(NATURE_WORLDS.map((world) => world.id)).size === 1000, 'world ids must be unique');")
          replace(corpus, "assert(new Set(NATURE_WORLDS.map((world) => world.seed)).size === 900, 'world seeds must be unique');", "assert(new Set(NATURE_WORLDS.map((world) => world.seed)).size === 1000, 'world seeds must be unique');")

          world3d = 'scripts/validate-world3d.ts'
          replace(world3d, 'if (plans.length !== 900) {', 'if (plans.length !== 1000) {')
          replace(world3d, 'throw new Error(`World Loom corpus invariant failed: expected 900 worlds, got ${plans.length}`);', 'throw new Error(`World Loom corpus invariant failed: expected 1000 worlds, got ${plans.length}`);')
          replace(world3d, "console.log('World Loom release validation passed: desktop 900/900 and strict WebXR 900/900.');", "console.log('World Loom release validation passed: desktop 1000/1000 and strict WebXR 1000/1000.');")

          guide = 'components/physiology/NatureWorldAtlas.tsx'
          replace(guide, '900-world illustrated field guide', '1,000-world illustrated field guide')
          replace(guide, '{summary.discovered}/900 discovered', '{summary.discovered}/1,000 discovered')
          replace(guide, '{summary.collectionsVisited}/17 collections', '{summary.collectionsVisited}/19 collections')

          page = 'app/physiology/page.tsx'
          replace(page, 'exploring 900 deterministic miniature nature worlds', 'exploring 1,000 deterministic miniature nature worlds')
          replace(page, 'inside a 900-world nature atlas', 'inside a 1,000-world nature atlas')
          replace(page, 'All 900 worlds still compile', 'All 1,000 worlds still compile')
          replace(page, "  ['☁️ 851–900 · celestial', 'Milky Way bands, aurora curtains, nebulae, planets, cloud streets, sun halos, meteor streaks, dawn light, and thunderheads.'],\n", "  ['☁️ 851–900 · celestial', 'Milky Way bands, aurora curtains, nebulae, planets, cloud streets, sun halos, meteor streaks, dawn light, and thunderheads.'],\n  ['🫶 901–950 · living sanctuaries', 'Cloud-forest nurseries, mangroves, pollinator corridors, kelp refuges, wetlands, animal habitat, mycelium, migration stops, and ecological relationships.'],\n  ['🪨 951–1000 · geological wonders', 'Travertine terraces, basalt columns, karst towers, cenotes, lava tubes, fumaroles, geodes, glacier structures, dunes, crater rims, and subterranean lakes.'],\n")
          replace(page, 'title="seventeen collections, one continuous little universe"', 'title="nineteen collections, one continuous little universe"')
          replace(page, 'title="900 worlds without 900 expensive renderers"', 'title="1,000 worlds without 1,000 expensive renderers"')

          Path('.github/workflows/world1000-expand.yml').unlink()
          PY

      - name: Validate 1000-world branch
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run check:nature-corpus
          npm run check:world3d

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/physiology/natureWorldsExpanded.ts scripts/validate-nature-corpus.ts scripts/validate-world3d.ts components/physiology/NatureWorldAtlas.tsx app/physiology/page.tsx .github/workflows/world1000-expand.yml
          git commit -m "Promote World Loom and Nature Atlas to 1000 worlds"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
