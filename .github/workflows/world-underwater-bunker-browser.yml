name: Sea Glass Underwater Maze Browser
on:
  pull_request:
    paths:
      - 'components/world/worldUnderwaterGallery.ts'
      - 'components/world/worldRenderer.ts'
      - 'components/world/WorldScene.tsx'
      - 'components/world/WorldHome.tsx'
      - 'lib/world/underwaterBunker.ts'
      - 'lib/world/content.ts'
      - 'scripts/playtest-underwater-gallery.mjs'
      - '.github/workflows/world-underwater-bunker-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sea-glass-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sea-glass-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      PLAYWRIGHT_MODULE_ROOT: /tmp/sea-glass-playwright/node_modules/playwright
      WORLD_AUDIT_DIR: artifacts/world/sea-glass
      WORLD_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check scripts and types
        run: |
          npm run typecheck
          node --check scripts/playtest-underwater-gallery.mjs
      - name: Install isolated Chromium WebGL
        run: |
          mkdir -p /tmp/sea-glass-playwright
          npm install --prefix /tmp/sea-glass-playwright --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          /tmp/sea-glass-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Start real world
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/sea-glass-next.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 120 /tmp/sea-glass-next.log
          exit 1
      - name: Verify submerged museum and circular hatch
        run: node scripts/playtest-underwater-gallery.mjs
      - name: Preserve gallery screenshots and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sea-glass-browser-${{ github.sha }}
          path: artifacts/world/sea-glass/
          if-no-files-found: warn
      - name: Diagnose failure
        if: failure()
        run: tail -n 180 /tmp/sea-glass-next.log || true
