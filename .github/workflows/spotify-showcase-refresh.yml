name: Refresh Spotify showcase

on:
  workflow_dispatch:
  schedule:
    # Weekly is plenty for a portfolio snapshot and keeps Development Mode API usage tiny.
    - cron: '17 13 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Spotify secrets
        id: spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$SPOTIFY_CLIENT_ID" && -n "$SPOTIFY_CLIENT_SECRET" && -n "$SPOTIFY_REFRESH_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Spotify showcase refresh skipped because repository secrets are not configured."
          fi

      - name: Refresh Top Items manifest
        if: steps.spotify.outputs.configured == 'true'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: npm run music:fetch

      - name: Commit refreshed manifest
        if: steps.spotify.outputs.configured == 'true'
        shell: bash
        run: |
          if git diff --quiet -- content/music/top-tracks.json; then
            echo "Spotify manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- content/music/top-tracks.json
          git commit -m "chore(rotation): refresh Spotify Top Items"
          git push
