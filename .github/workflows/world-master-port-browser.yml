name: iLand Master-Port Browser Evidence
on:
  pull_request:
    paths:
      - "app/world/**"
      - "components/world/**"
      - "lib/world/**"
      - "scripts/playtest-ski-v3.mjs"
      - "scripts/playtest-clean-mountain-halfpipe.mjs"
      - ".github/workflows/world-master-port-browser.yml"
  workflow_dispatch:

jobs:
  world-ski-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        ski_v3: ["0","1"]
    env:
      NEXT_PUBLIC_SKI_V3: ${{ matrix.ski_v3 }}
      WORLD_BASE_URL: http://127.0.0.1:3000/world
      WORLD_AUDIT_DIR: artifacts/world-master-browser
      PLAYWRIGHT_MODULE_ROOT: /tmp/world-port-playwright/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked website dependencies
        run: npm ci
      - name: Install supported Chromium for exact Ubuntu runner
        run: |
          npm install --prefix /tmp/world-port-playwright --no-package-lock playwright@1.56.1
          /tmp/world-port-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Start the exact-head standalone island
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/world-port-browser.log 2>&1 &
          for i in $(seq 1 100); do
            if curl -fsS "$WORLD_BASE_URL" >/dev/null; then
              echo "World route responded"; exit 0
            fi
            sleep 2
          done
          tail -n 100 /tmp/world-port-browser.log
          exit 1
      - name: Browser evidence for real V3 or legacy menu Ski Jump
        run: |
          if [ "$NEXT_PUBLIC_SKI_V3" = "1" ]; then
            node scripts/playtest-ski-v3.mjs
          else
            node scripts/playtest-clean-mountain-halfpipe.mjs
          fi
      - name: Save tested head even if browser fails
        if: always()
        run: |
          mkdir -p artifacts/world-master-browser
          git rev-parse HEAD > artifacts/world-master-browser/tested-sha.txt
          cp /tmp/world-port-browser.log artifacts/world-master-browser/server.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-master-browser-${{ matrix.ski_v3 }}-${{ github.sha }}
          path: artifacts/world-master-browser/
          if-no-files-found: warn
