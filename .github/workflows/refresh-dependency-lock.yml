name: Refresh dependency lock

on:
  push:
    branches:
      - fix/arcade-aspect-safe-fullscreen

permissions:
  contents: write

jobs:
  refresh-lock:
    if: "!startsWith(github.event.head_commit.message, 'chore(deps): refresh audited lockfile')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arcade-aspect-safe-fullscreen
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh exact lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh audited lockfile"
          git push origin HEAD:fix/arcade-aspect-safe-fullscreen
