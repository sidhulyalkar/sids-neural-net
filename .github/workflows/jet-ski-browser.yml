name: Jet-Ski Browser Acceptance

on:
  pull_request:
    paths:
      - 'components/world/**'
      - 'lib/world/**'
      - 'scripts/playtest-jet-ski.mjs'
      - 'scripts/playtest-ride-ghost.mjs'
      - 'scripts/playtest-skatepark.mjs'
      - 'scripts/playtest-shasta-snow.mjs'
      - 'scripts/playtest-disc-golf-arcade.mjs'
      - 'scripts/playtest-disc-hole2-pier.mjs'
      - 'scripts/playtest-mountain-jump.mjs'
      - '.github/workflows/jet-ski-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jet-ski-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jet-ski-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Install isolated Playwright runner and Chromium
        run: |
          # Installing --no-save in the app root can re-resolve its unrelated
          # dependencies and fail on registry mirrors. Isolate the runner.
          mkdir -p /tmp/island-playwright
          npm install --prefix /tmp/island-playwright --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          /tmp/island-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Start local World development server
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/world-dev.log 2>&1 &
          echo $! > /tmp/world-dev.pid
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/world-dev.log
          exit 1
      - name: Start Hole 2 from the elevated clear pier tee
        env:
          WORLD_BASE_URL: http://127.0.0.1:3000
          WORLD_AUDIT_DIR: artifacts/world/disc-hole2-pier
          PLAYWRIGHT_MODULE_ROOT: /tmp/island-playwright/node_modules/playwright
        run: node scripts/playtest-disc-hole2-pier.mjs
      - name: Confirm arcade disc drive leaves hand, glides, and lands
        env:
          WORLD_BASE_URL: http://127.0.0.1:3000
          WORLD_AUDIT_DIR: artifacts/world/disc-golf-arcade-browser
          PLAYWRIGHT_MODULE_ROOT: /tmp/island-playwright/node_modules/playwright
        run: node scripts/playtest-disc-golf-arcade.mjs
      - name: Qualify Shasta snow zoom, roll and planted gait
        env:
          WORLD_BASE_URL: http://127.0.0.1:3000
          WORLD_AUDIT_DIR: artifacts/world/shasta-snow-play
          PLAYWRIGHT_MODULE_ROOT: /tmp/island-playwright/node_modules/playwright
        run: node scripts/playtest-shasta-snow.mjs
      - name: Walk pier, choose ride, boost, reverse and dock
        env:
          WORLD_BASE_URL: http://127.0.0.1:3000
          WORLD_AUDIT_DIR: artifacts/world/jet-ski-browser
        run: |
          export PLAYWRIGHT_MODULE_ROOT="/tmp/island-playwright/node_modules/playwright"
          node scripts/playtest-jet-ski.mjs
      - name: Test freeform mountain ski flight and companion birds
        env:
          WORLD_BASE_URL: http://127.0.0.1:3000
          WORLD_AUDIT_DIR: artifacts/world/mountain-jump-browser
          PLAYWRIGHT_MODULE_ROOT: /tmp/island-playwright/node_modules/playwright
        run: node scripts/playtest-mountain-jump.mjs
      - name: Race Joshua pace ghosts and shoot a real target
        env:
          WORLD_BASE_URL: http://127.0.0.1:3000
          WORLD_AUDIT_DIR: artifacts/world/ride-ghost-browser
          PLAYWRIGHT_MODULE_ROOT: /tmp/island-playwright/node_modules/playwright
        run: node scripts/playtest-ride-ghost.mjs
      - name: Ride south meadow skatepark, flick and land trick combo
        env:
          WORLD_BASE_URL: http://127.0.0.1:3000
          WORLD_AUDIT_DIR: artifacts/world/skatepark-browser
          PLAYWRIGHT_MODULE_ROOT: /tmp/island-playwright/node_modules/playwright
        run: node scripts/playtest-skatepark.mjs
      - name: Upload browser evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jet-ski-browser-${{ github.sha }}
          path: |
            artifacts/world/jet-ski-browser
            artifacts/world/mountain-jump-browser
            artifacts/world/ride-ghost-browser
            artifacts/world/skatepark-browser
            artifacts/world/shasta-snow-play
            artifacts/world/disc-golf-arcade-browser
            artifacts/world/disc-hole2-pier
            /tmp/world-dev.log
          if-no-files-found: warn
