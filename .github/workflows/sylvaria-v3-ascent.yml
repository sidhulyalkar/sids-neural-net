name: Sylvaria v3 Ancient Tree Ascent Lab

on:
  pull_request:
    paths:
      - 'public/game-runtimes/sylvaria-v3/**'
      - 'src/data/arcadeGames.ts'
      - 'tests/sylvaria-v3-ancient-tree.test.ts'
      - 'tests/arcade-discovery.test.ts'
      - 'tests/sylvaria-v2-sideview.test.ts'
      - 'scripts/playtest-sylvaria-v3-ascent.mjs'
      - 'vercel.json'
      - '.github/workflows/sylvaria-v3-ascent.yml'
      - '.github/workflows/sylvaria-v2-sideview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ancient-tree-ascent-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Parse Sylvaria v3 browser modules
        run: |
          node --check public/game-runtimes/sylvaria-v3/config-v3.js
          node --check public/game-runtimes/sylvaria-v3/input-v3.js
          node --check public/game-runtimes/sylvaria-v3/world-v3.js
          node --check public/game-runtimes/sylvaria-v3/engine-v3.js
          node --check public/game-runtimes/sylvaria-v3/engine-feel-v3.js
          node --check public/game-runtimes/sylvaria-v3/render-v3.js
          node --check public/game-runtimes/sylvaria-v3/game-v3.js
      - name: Validate ancient-tree design contracts
        run: node --import tsx --test tests/sylvaria-v3-ancient-tree.test.ts tests/sylvaria-v2-sideview.test.ts tests/arcade-discovery.test.ts
      - name: Typecheck website integration
        run: npm run typecheck
      - name: Lint website integration
        run: npm run lint
      - name: Build deterministic site
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_WORLD_LOOM_XR: disabled
        run: npm run build
      - name: Start built site
        run: |
          npx next start -p 3000 > /tmp/sylvaria-v3.log 2>&1 &
          echo $! > /tmp/sylvaria-v3.pid
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/game-runtimes/sylvaria-v3/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sylvaria-v3.log
          exit 1
      - name: Install Chromium qualification engine
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Qualify ancient tree ascent movement and combat
        run: |
          PW_BIN="$(npm exec --yes --package=playwright@1.55.0 -- which playwright)"
          PW_ROOT="$(cd "$(dirname "$PW_BIN")/.." && pwd)"
          PLAYWRIGHT_MODULE_ROOT="$PW_ROOT" node scripts/playtest-sylvaria-v3-ascent.mjs
      - name: Upload ascent playtest artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sylvaria-v3-ascent-artifacts
          path: artifacts/sylvaria-v3
          if-no-files-found: warn
          retention-days: 14
