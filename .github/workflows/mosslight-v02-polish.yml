name: One-Shot Mosslight v0.2 Guidance Polish

on:
  push:
    branches:
      - agent/xr-react-visual-arcade

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: agent/xr-react-visual-arcade
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Apply guided-selection and intro polish
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/game-runtimes/mosslight-v2/game.js')
          text = path.read_text()

          old = """  function nextUsefulAbility() {
              if (!state.room) return 'rain';
              const unfinished = state.room.targets.filter((target) => !target.done);
              const currentStillUseful = unfinished.some((target) => targetExpected(target) === state.selected);
              if (currentStillUseful) return state.selected;
              const nearest = nearestTarget(unfinished);
              return nearest ? targetExpected(nearest) : state.room.unlock[0];
            }
          """
          new = """  function nextUsefulAbility() {
              if (!state.room) return 'rain';
              const unfinished = state.room.targets.filter((target) => !target.done);
              const nearest = nearestTarget(unfinished);
              if (nearest) return targetExpected(nearest);
              return state.room.unlock[0];
            }
          """
          if old not in text:
              raise SystemExit('nextUsefulAbility exact block not found')
          text = text.replace(old, new, 1)

          old_intro = "introTimer = setTimeout(() => ui.intro.classList.remove('show'), 1900);"
          new_intro = "introTimer = setTimeout(() => ui.intro.classList.remove('show'), 1350);"
          if old_intro not in text:
              raise SystemExit('intro timeout exact expression not found')
          text = text.replace(old_intro, new_intro, 1)

          path.write_text(text)
          Path('.github/workflows/mosslight-v02-polish.yml').unlink()
          PY

      - name: Validate polished runtime
        run: |
          npm ci
          npm run check:mosslight
          npm run typecheck
          npm run lint
          npm run check:nature-corpus
          npm run check:world3d

      - name: Commit validated polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/game-runtimes/mosslight-v2/game.js .github/workflows/mosslight-v02-polish.yml
          git commit -m "Refine Mosslight guided play and room intros"
          git push origin HEAD:agent/xr-react-visual-arcade
