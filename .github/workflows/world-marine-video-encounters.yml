name: World Wildlife Video Encounters QA

on:
  push:
    branches: ['feat/marine-wildlife-video-encounters']
    paths:
      - 'src/data/visualMotion.ts'
      - 'lib/world/model.ts'
      - 'lib/world/marineVideoEncounters.ts'
      - 'lib/world/marineVideoCatalog.ts'
      - 'lib/world/content.ts'
      - 'components/world/worldRenderer.ts'
      - 'scripts/prepare-visual-motion.py'
      - 'tests/world-marine-video-encounters.test.ts'
      - '.github/workflows/world-marine-video-encounters.yml'
  pull_request:
    paths:
      - 'src/data/visualMotion.ts'
      - 'lib/world/model.ts'
      - 'lib/world/marineVideoEncounters.ts'
      - 'lib/world/marineVideoCatalog.ts'
      - 'lib/world/content.ts'
      - 'components/world/worldRenderer.ts'
      - 'scripts/prepare-visual-motion.py'
      - 'tests/world-marine-video-encounters.test.ts'
      - '.github/workflows/world-marine-video-encounters.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marine-encounter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marine-encounters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Validate source and footage-preparation syntax
        run: |
          npm run typecheck
          npx eslint src/data/visualMotion.ts lib/world/model.ts lib/world/marineVideoEncounters.ts lib/world/marineVideoCatalog.ts components/world/worldRenderer.ts tests/world-marine-video-encounters.test.ts --max-warnings=0
          python -m py_compile scripts/prepare-visual-motion.py
      - name: Validate fauna/clip discovery contracts
        run: node --import tsx --test tests/world-marine-video-encounters.test.ts
