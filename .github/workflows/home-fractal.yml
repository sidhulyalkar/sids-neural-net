name: Adaptive Fractal Home CI

on:
  pull_request:
    paths:
      - 'app/page.tsx'
      - 'components/neural-atlas-canvas/**'
      - 'lib/home/fractalDendrite.ts'
      - 'lib/home/fractalDendriteV4.ts'
      - 'lib/home/fractalDendriteV5.ts'
      - 'lib/home/fractalDendriteV6.ts'
      - 'tests/home-dendrite-regression.test.ts'
      - 'tests/home-dendrite-v4-regression.test.ts'
      - 'tests/home-dendrite-v5-regression.test.ts'
      - 'tests/home-dendrite-v6-regression.test.ts'
      - 'scripts/playtest-arcade-home.mjs'
      - 'scripts/fractal-home-gallery.mjs'
      - 'tsconfig.json'
      - '.github/workflows/home-fractal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-fractal-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fractal-home-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint fractal homepage surface
        run: >-
          npx eslint
          app/page.tsx
          components/neural-atlas-canvas/AdaptiveFractalHome.tsx
          components/neural-atlas-canvas/AdaptiveFractalStage.tsx
          components/neural-atlas-canvas/FractalSurfaceEnhancerV2.tsx
          lib/home/fractalDendrite.ts
          lib/home/fractalDendriteV4.ts
          lib/home/fractalDendriteV5.ts
          lib/home/fractalDendriteV6.ts
          tests/home-dendrite-regression.test.ts
          tests/home-dendrite-v4-regression.test.ts
          tests/home-dendrite-v5-regression.test.ts
          tests/home-dendrite-v6-regression.test.ts
          scripts/playtest-arcade-home.mjs
          scripts/fractal-home-gallery.mjs
          --no-warn-ignored
          --max-warnings=0

      - name: Run fractal geometry regressions
        run: >-
          node --import tsx --test
          tests/home-dendrite-regression.test.ts
          tests/home-dendrite-v4-regression.test.ts
          tests/home-dendrite-v5-regression.test.ts
          tests/home-dendrite-v6-regression.test.ts

      - name: Build production site
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_WORLD_LOOM_XR: disabled
        run: npm run build

      - name: Install Chromium audit engine
        run: |
          rm -rf /tmp/home-playwright
          npm install --prefix /tmp/home-playwright --no-package-lock --no-save playwright@1.55.0
          /tmp/home-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Start built site
        run: |
          npx next start -p 3000 > /tmp/adaptive-fractal-home.log 2>&1 &
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/adaptive-fractal-home.log
          exit 1

      - name: Audit responsive fractal geometry and navigation
        env:
          PLAY_PATH: /tmp/home-playwright/node_modules/playwright
          PLAYWRIGHT_MODULE_ROOT: /tmp/home-playwright/node_modules/playwright
          ARCADE_HOME_BASE_URL: http://127.0.0.1:3000
          ARCADE_HOME_PLAYTEST_DIR: artifacts/adaptive-fractal-home
        run: node scripts/playtest-arcade-home.mjs

      - name: Capture deterministic morphology gallery
        env:
          PLAYWRIGHT_MODULE_ROOT: /tmp/home-playwright/node_modules/playwright
          FRACTAL_HOME_BASE_URL: http://127.0.0.1:3000
          FRACTAL_HOME_GALLERY_DIR: artifacts/adaptive-fractal-home/gallery
        run: node scripts/fractal-home-gallery.mjs

      - name: Upload fractal screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adaptive-fractal-home-audit
          path: artifacts/adaptive-fractal-home
          if-no-files-found: warn
          retention-days: 14
