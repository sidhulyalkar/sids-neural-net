name: FRONTIER v18 Render Hardening Cleanup

on:
  push:
    branches:
      - feat/frontier-live-authority-bridge-v18

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Finalize deferred authority hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/frontier-v18-render-hardening.yml
          git commit -m 'Remove one-shot v18 render transform'
          git push origin HEAD:${{ github.ref_name }}
