name: FRONTIER v22 dependency refresh

on:
  push:
    branches:
      - frontier/v22-predictive-page-turn

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[skip lock-refresh]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Patch Next.js baseline and regenerate lock
        run: npm install --package-lock-only --save-exact next@16.3.4 eslint-config-next@16.3.4

      - name: Prove production audit clears high severity
        run: npm audit --omit=dev --audit-level=high

      - name: Commit generated dependency state and remove helper
        run: |
          git config user.name "frontier-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/frontier-v22-dependency-refresh.yml
          git add package.json package-lock.json
          git commit -m "chore(deps): patch Next.js security baseline [skip lock-refresh]"
          git push origin HEAD:${{ github.ref_name }}
