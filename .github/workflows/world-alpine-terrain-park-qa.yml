name: Alpine Terrain Park Browser QA
on:
  pull_request:
    paths:
      - 'lib/world/alpineTerrainPark.ts'
      - 'lib/world/model.ts'
      - 'lib/world/activities.ts'
      - 'lib/world/skatepark.ts'
      - 'components/world/**'
      - 'scripts/playtest-alpine-terrain-park.mjs'
      - 'scripts/playtest-alpine-tricks.mjs'
      - 'lib/world/alpineTricks.ts'
      - 'tests/world-alpine-tricks.test.ts'
      - '.github/workflows/world-alpine-terrain-park-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpine-park-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpine-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    env:
      WORLD_BASE_URL: http://localhost:3000
      WORLD_AUDIT_DIR: artifacts/world/alpine
      PLAYWRIGHT_MODULE_ROOT: ${{ github.workspace }}/node_modules/playwright
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install exact production website dependencies
        run: npm ci
      - name: Install independent Chromium rendering
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start World
        run: |
          (npm run dev > /tmp/world-alpine-next.log 2>&1 &)
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000 >/dev/null; then
              echo "World ready"; exit 0
            fi
            sleep 2
          done
          cat /tmp/world-alpine-next.log
          exit 1
      - name: Ski halfpipe, west-to-east ice tunnel and east-to-west return
        run: node scripts/playtest-alpine-terrain-park.mjs
      - name: Real feature takeoffs, trick grabs/spins, landing and recovery
        run: node scripts/playtest-alpine-tricks.mjs
      - name: Print startup failures
        if: failure()
        run: tail -n 160 /tmp/world-alpine-next.log || true
      - name: Upload visual evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpine-terrain-park-${{ github.sha }}
          path: |
            artifacts/world/alpine/
            /tmp/world-alpine-next.log
          if-no-files-found: warn
