name: Crownrush CI

on:
  pull_request:
    paths:
      - '.github/workflows/crownrush-ci.yml'
      - 'app/arcade/**'
      - 'components/arcade/**'
      - 'src/data/arcadeGames.ts'
      - 'public/game-runtimes/crownrush/**'
      - 'scripts/validate-crownrush.mjs'
      - 'scripts/playtest-arcade-browsers.mjs'
      - 'tests/arcade-discovery.test.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crownrush-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crownrush-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci

      - name: Typecheck website integration
        run: npm run typecheck

      - name: Run repository unit tests
        run: npm test

      - name: Validate Crownrush deterministic runtime invariants
        run: npm run check:crownrush

      - name: Build production website
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_WORLD_LOOM_XR: disabled
        run: npm run build

      - name: Start built website
        run: |
          npx next start -p 3000 > /tmp/crownrush-site.log 2>&1 &
          echo $! > /tmp/crownrush-site.pid
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/arcade/crownrush >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/crownrush-site.log
          exit 1

      - name: Smoke Crownrush cabinet and runtime
        run: |
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/arcade/crownrush >/dev/null
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/crownrush/index.html | grep -q 'Crownrush v0.1.0'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/crownrush/game.js | grep -q 'fixedHz: 120'

      - name: Install browser engines
        run: |
          rm -rf /tmp/crownrush-playwright
          npm install --prefix /tmp/crownrush-playwright --no-package-lock --no-save playwright@1.55.0
          /tmp/crownrush-playwright/node_modules/.bin/playwright install --with-deps chromium firefox webkit
          /tmp/crownrush-playwright/node_modules/.bin/playwright install chrome

      - name: Validate Game Network including Crownrush across four engines
        env:
          PLAYWRIGHT_MODULE_ROOT: /tmp/crownrush-playwright/node_modules/playwright
          ARCADE_BROWSER_DIR: artifacts/crownrush-browser-matrix
        run: node scripts/playtest-arcade-browsers.mjs

      - name: Upload Crownrush browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crownrush-browser-evidence
          path: artifacts/crownrush-browser-matrix
          if-no-files-found: warn
          retention-days: 14
