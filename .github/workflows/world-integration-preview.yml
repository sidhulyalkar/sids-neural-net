name: World Integration Preview (No Branch Mutation)

on:
  push:
    branches: ['feat/island-jetski-dock-race-v1']
    paths:
      - '.github/workflows/world-integration-preview.yml'
      - 'scripts/resolve-world-integration.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-merge-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run-three-way-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect moving base and preserve merge candidates
        shell: bash
        run: |
          mkdir -p artifacts/world-integration
          git fetch --no-tags origin feat/sids-world
          git rev-parse HEAD > artifacts/world-integration/pr-head.sha
          git rev-parse origin/feat/sids-world > artifacts/world-integration/base-head.sha
          git merge-base HEAD origin/feat/sids-world > artifacts/world-integration/merge-base.sha
          git config user.name 'World Integration QA'
          git config user.email 'world-integration-qa@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff origin/feat/sids-world > artifacts/world-integration/merge.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > artifacts/world-integration/merge-status.txt
          git status --short > artifacts/world-integration/status.txt
          git diff --name-only --diff-filter=U > artifacts/world-integration/conflict-paths.txt
          git diff --cc > artifacts/world-integration/combined-conflicts.patch || true
          if [ "$result" -ne 0 ]; then
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                mkdir -p "artifacts/world-integration/conflict-files/$(dirname "$file")"
                cp "$file" "artifacts/world-integration/conflict-files/$file"
              fi
            done < artifacts/world-integration/conflict-paths.txt
          fi
          echo "PR head: $(cat artifacts/world-integration/pr-head.sha)"
          echo "Base head: $(cat artifacts/world-integration/base-head.sha)"
          echo "Merge status: $result"
          cat artifacts/world-integration/conflict-paths.txt
      - name: Resolve strictly reviewed mixed-game conflict sections
        run: |
          if [ "$(cat artifacts/world-integration/merge-status.txt)" != "0" ]; then
            mapfile -t conflicts < artifacts/world-integration/conflict-paths.txt
            python3 scripts/resolve-world-integration.py "${conflicts[@]}"
            git add -- "${conflicts[@]}" lib/world/skimboarding.ts lib/world/model.ts tests/world-skimboarding.test.ts lib/world/jetSkiRace.ts tests/world-jet-ski-race.test.ts
            # Diagnostic .tsx copies sit under artifacts/. If kept in the
            # checkout, tsc would compile their unresolved conflict markers.
            # The reviewed resolved sources are now staged and authoritative.
            rm -rf artifacts/world-integration/conflict-files
            test -z "$(git diff --name-only --diff-filter=U)"
            git diff --cached --check
            printf '0\n' > artifacts/world-integration/merge-status.txt
            echo "Reviewed merge conflicts are resolved in this temporary checkout only."
          fi
          git diff --cached --stat > artifacts/world-integration/resolved-files.txt
          test -f lib/world/skimboarding.ts
          test -f lib/world/skatepark.ts
      - name: Reject unmerged work, never silently select one side
        run: |
          if [ "$(cat artifacts/world-integration/merge-status.txt)" != "0" ]; then
            echo "::error::Merge conflicts remain. Review uploaded exact conflict files before integration."
            exit 1
          fi
          test -f lib/world/skimboarding.ts
          test -f lib/world/skatepark.ts
          test -f components/world/worldSkateGroveGeometry.ts
      - uses: actions/setup-node@v4
        if: success()
        with:
          node-version: '24'
          cache: npm
      - name: Install merged dependencies exactly
        if: success()
        run: npm ci
      - name: Typecheck merged World
        if: success()
        run: npm run typecheck
      - name: Verify merged skate and skimboarding contracts
        if: success()
        run: node --import tsx --test tests/world-skate*.test.ts tests/world-skimboarding.test.ts
      - name: Verify merged World unit contracts
        if: success()
        run: node --import tsx --test tests/world-*.test.ts
      - name: Install isolated merged-browser runtime
        if: success()
        run: |
          mkdir -p /tmp/world-integration-playwright
          npm install --prefix /tmp/world-integration-playwright --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          /tmp/world-integration-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve exactly the merged source tree
        if: success()
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/world-integration-next.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 120 /tmp/world-integration-next.log
          exit 1
      - name: Browser QA - north-shore skimboarding
        if: success()
        env:
          WORLD_BASE_URL: http://127.0.0.1:3000
          WORLD_AUDIT_DIR: artifacts/world-integration/skimboarding
          PLAYWRIGHT_MODULE_ROOT: /tmp/world-integration-playwright/node_modules/playwright
        run: node scripts/playtest-skimboarding.mjs
      - name: Browser QA - redwood bowl return and real landed trick
        if: success()
        env:
          WORLD_BASE_URL: http://127.0.0.1:3000
          WORLD_AUDIT_DIR: artifacts/world-integration/redwood-flow
          PLAYWRIGHT_MODULE_ROOT: /tmp/world-integration-playwright/node_modules/playwright
        run: node scripts/playtest-skate-grove-flow.mjs
      - name: Browser QA - redwood skatepark and assisted combos
        if: success()
        env:
          WORLD_BASE_URL: http://127.0.0.1:3000
          WORLD_AUDIT_DIR: artifacts/world-integration/skatepark
          PLAYWRIGHT_MODULE_ROOT: /tmp/world-integration-playwright/node_modules/playwright
        run: node scripts/playtest-skatepark.mjs
      - name: Browser QA - Joshua moving target and two ghost riders
        if: success()
        env:
          WORLD_BASE_URL: http://127.0.0.1:3000
          WORLD_AUDIT_DIR: artifacts/world-integration/joshua-ghosts
          PLAYWRIGHT_MODULE_ROOT: /tmp/world-integration-playwright/node_modules/playwright
        run: node scripts/playtest-ride-ghost.mjs
      - name: Browser QA - jet ski boarding, navigation and racing
        if: success()
        env:
          WORLD_BASE_URL: http://127.0.0.1:3000
          WORLD_AUDIT_DIR: artifacts/world-integration/jet-ski
          PLAYWRIGHT_MODULE_ROOT: /tmp/world-integration-playwright/node_modules/playwright
        run: node scripts/playtest-jet-ski.mjs
      - name: Upload integration evidence even on conflicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-integration-preview-${{ github.sha }}
          path: artifacts/world-integration/
          if-no-files-found: warn
