name: Website CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FRONTIER_INTERACTION_AUDIT: enabled
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install exact locked dependencies
        run: |
          npm ci
          mkdir -p artifacts/dependency-lock
          cp package-lock.json artifacts/dependency-lock/package-lock.json

      - name: Audit dependencies
        run: |
          mkdir -p artifacts/security
          npm audit --json > artifacts/security/npm-audit-all.json || true
          npm audit --omit=dev --json > artifacts/security/npm-audit-production.json || true
          npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate Sylvaria Sequoia kinetic runtime
        run: npm run check:sylvaria-sequoia

      - name: Validate deterministic Nature Atlas corpus
        run: npm run check:nature-corpus

      - name: Audit 1000 World Loom scenes
        run: npm run check:world3d

      - name: Generate Next route and module bundle analysis
        run: |
          npx next experimental-analyze --output
          mkdir -p artifacts/bundle-analyzer
          cp -R .next/diagnostics/analyze/. artifacts/bundle-analyzer/

      - name: Build deterministic committed site state
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_WORLD_LOOM_XR: disabled
        run: npm run build

      - name: Enforce emitted JavaScript bundle budget
        run: npm run check:bundle

      - name: Start built site
        run: |
          npx next start -p 3000 > /tmp/sids-neural-net.log 2>&1 &
          echo $! > /tmp/sids-neural-net.pid
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sids-neural-net.log
          exit 1

      - name: Smoke public production routes
        run: |
          for route in / /frontier /api/frontier/feed /api/auth/session /neural-net /case-studies /physiology /perceptual-cortex /rotation /sensing-lab /physiology/visual-audit /photography /arcade /arcade/stretchicorn /arcade/unirico /arcade/sylvaria-sequoia; do
            echo "GET $route"
            curl --retry 2 --retry-connrefused -fsS "http://127.0.0.1:3000$route" >/dev/null
          done
          echo "GET Stretchicorn v0.21.1 runtime"
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/stretchicorn/index.html | grep -q 'Stretchicorn v0.21.1'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/stretchicorn/src/00-core.js | grep -q 'CORE WORLD + GEOMETRY'
          echo "GET uniRico runtime"
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/unirico/index.html | grep -q '<canvas id="c"'
          echo "GET Sylvaria: Sequoia v0.2.0 runtime"
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/sylvaria-sequoia/index.html | grep -q 'Sylvaria: Sequoia v0.2.0'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/sylvaria-sequoia/04-input.js | grep -q 'fixedHz: 120'

      - name: Smoke FRONTIER privacy boundaries
        run: |
          memory_status="$(curl -sS -o /tmp/frontier-memory.json -w '%{http_code}' http://127.0.0.1:3000/api/frontier/memory)"
          test "$memory_status" = "401"
          grep -q 'unauthorized' /tmp/frontier-memory.json

          google_status="$(curl -sS -o /tmp/frontier-google.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/frontier/google/import)"
          test "$google_status" = "401"
          grep -q 'unauthorized' /tmp/frontier-google.json

          session="$(curl -fsS http://127.0.0.1:3000/api/auth/session)"
          echo "$session" | grep -q '"authenticated":false'

      - name: Smoke FRONTIER media gateway boundaries
        run: |
          missing_status="$(curl -sS -o /tmp/frontier-media-missing.json -w '%{http_code}' http://127.0.0.1:3000/api/frontier/media)"
          test "$missing_status" = "400"
          grep -q 'missing media url' /tmp/frontier-media-missing.json

          unsafe_status="$(curl -sS -o /tmp/frontier-media-unsafe.json -w '%{http_code}' 'http://127.0.0.1:3000/api/frontier/media?url=http%3A%2F%2F127.0.0.1%2Fprivate.png')"
          test "$unsafe_status" = "403"
          grep -q 'not trusted' /tmp/frontier-media-unsafe.json

      - name: Smoke FRONTIER ingestion boundaries
        run: |
          unsupported_status="$(curl -sS -o /tmp/frontier-ingest-unsupported.json -w '%{http_code}' 'http://127.0.0.1:3000/api/frontier/ingest?source=not-a-source')"
          test "$unsupported_status" = "400"
          grep -q 'unsupported FRONTIER source' /tmp/frontier-ingest-unsupported.json

      - name: Install browser audit engines
        run: |
          rm -rf /tmp/frontier-playwright
          npm install --prefix /tmp/frontier-playwright --no-package-lock --no-save playwright@1.55.0
          /tmp/frontier-playwright/node_modules/.bin/playwright install --with-deps chromium firefox webkit
          /tmp/frontier-playwright/node_modules/.bin/playwright install chrome

      - name: Audit FRONTIER bounded first useful paint
        env:
          NODE_PATH: /tmp/frontier-playwright/node_modules
          FRONTIER_ROUTE_AUDIT_URL: http://127.0.0.1:3000/frontier
        run: node scripts/frontier-route-readiness-audit.cjs

      - name: Choreograph FRONTIER Phase 8 interactions
        env:
          NODE_PATH: /tmp/frontier-playwright/node_modules
          FRONTIER_AUDIT_URL: http://127.0.0.1:3000/frontier/interaction-audit
        run: node scripts/frontier-phase8-choreography.cjs

      - name: Audit FRONTIER Phase 9 synthesis and reactive artifacts
        env:
          NODE_PATH: /tmp/frontier-playwright/node_modules
          FRONTIER_PHASE9_AUDIT_URL: http://127.0.0.1:3000/frontier/phase9-audit
        run: node scripts/frontier-phase9-browser-audit.cjs

      - name: Audit FRONTIER Phase 8.1 media mosaic
        env:
          NODE_PATH: /tmp/frontier-playwright/node_modules
          FRONTIER_MOSAIC_AUDIT_URL: http://127.0.0.1:3000/frontier/mosaic-audit
        run: node scripts/frontier-media-mosaic-audit.cjs

      - name: Audit FRONTIER deterministic scroll geometry
        env:
          NODE_PATH: /tmp/frontier-playwright/node_modules
          FRONTIER_SCROLL_AUDIT_URL: http://127.0.0.1:3000/frontier/mosaic-audit
        run: node scripts/frontier-scroll-stability-audit.cjs

      - name: Validate homepage Game Network CTA
        env:
          PLAYWRIGHT_MODULE_ROOT: /tmp/frontier-playwright/node_modules/playwright
        run: node scripts/playtest-arcade-home.mjs

      - name: Validate Game Network across Chrome Stable Chromium Firefox and WebKit
        env:
          PLAYWRIGHT_MODULE_ROOT: /tmp/frontier-playwright/node_modules/playwright
        run: node scripts/playtest-arcade-browsers.mjs

      - name: Capture production browser fixtures
        run: |
          mkdir -p artifacts/browser-smoke
          /tmp/frontier-playwright/node_modules/.bin/playwright screenshot --browser=chromium --wait-for-timeout 9000 --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/frontier artifacts/browser-smoke/frontier-desktop.png
          /tmp/frontier-playwright/node_modules/.bin/playwright screenshot --browser=chromium --wait-for-timeout 9000 --viewport-size="390,844" --full-page http://127.0.0.1:3000/frontier artifacts/browser-smoke/frontier-mobile.png
          /tmp/frontier-playwright/node_modules/.bin/playwright screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/physiology/visual-audit artifacts/browser-smoke/nature-atlas-desktop.png
          /tmp/frontier-playwright/node_modules/.bin/playwright screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:3000/physiology/visual-audit artifacts/browser-smoke/nature-atlas-mobile.png
          /tmp/frontier-playwright/node_modules/.bin/playwright screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/neural-net artifacts/browser-smoke/neural-net.png
          /tmp/frontier-playwright/node_modules/.bin/playwright screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/perceptual-cortex artifacts/browser-smoke/perceptual-cortex.png
          /tmp/frontier-playwright/node_modules/.bin/playwright screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/rotation artifacts/browser-smoke/rotation.png
          /tmp/frontier-playwright/node_modules/.bin/playwright screenshot --browser=chromium --viewport-size="1440,1000" --full-page http://127.0.0.1:3000/case-studies artifacts/browser-smoke/case-studies.png
          /tmp/frontier-playwright/node_modules/.bin/playwright screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/photography artifacts/browser-smoke/visual-cortex.png
          /tmp/frontier-playwright/node_modules/.bin/playwright screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/arcade artifacts/browser-smoke/game-network.png
          /tmp/frontier-playwright/node_modules/.bin/playwright screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/arcade/stretchicorn artifacts/browser-smoke/arcade-stretchicorn.png
          /tmp/frontier-playwright/node_modules/.bin/playwright screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/arcade/unirico artifacts/browser-smoke/arcade-unirico.png
          /tmp/frontier-playwright/node_modules/.bin/playwright screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/arcade/sylvaria-sequoia artifacts/browser-smoke/arcade-sylvaria-sequoia.png

      - name: Upload production audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-audit-artifacts
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
