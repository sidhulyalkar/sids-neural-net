name: Website CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install exact locked dependencies
        run: |
          npm ci
          mkdir -p artifacts/dependency-lock
          cp package-lock.json artifacts/dependency-lock/package-lock.json

      - name: Audit dependencies
        run: |
          mkdir -p artifacts/security
          npm audit --json > artifacts/security/npm-audit-all.json || true
          npm audit --omit=dev --json > artifacts/security/npm-audit-production.json || true
          npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate deterministic Nature Atlas corpus
        run: npm run check:nature-corpus

      - name: Audit 900 World Loom scenes
        run: npm run check:world3d

      - name: Generate Next route and module bundle analysis
        run: |
          npx next experimental-analyze --output
          mkdir -p artifacts/bundle-analyzer
          cp -R .next/diagnostics/analyze/. artifacts/bundle-analyzer/

      - name: Build deterministic committed site state
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_WORLD_LOOM_XR: disabled
        run: npm run build

      - name: Enforce emitted JavaScript bundle budget
        run: npm run check:bundle

      - name: Start built site
        run: |
          npx next start -p 3000 > /tmp/sids-neural-net.log 2>&1 &
          echo $! > /tmp/sids-neural-net.pid
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sids-neural-net.log
          exit 1

      - name: Smoke public production routes
        run: |
          for route in / /frontier /api/frontier/feed /api/auth/session /neural-net /case-studies /physiology /perceptual-cortex /rotation /sensing-lab /physiology/visual-audit; do
            echo "GET $route"
            curl --retry 2 --retry-connrefused -fsS "http://127.0.0.1:3000$route" >/dev/null
          done

      - name: Smoke FRONTIER privacy boundaries
        run: |
          memory_status="$(curl -sS -o /tmp/frontier-memory.json -w '%{http_code}' http://127.0.0.1:3000/api/frontier/memory)"
          test "$memory_status" = "401"
          grep -q 'unauthorized' /tmp/frontier-memory.json

          google_status="$(curl -sS -o /tmp/frontier-google.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/frontier/google/import)"
          test "$google_status" = "401"
          grep -q 'unauthorized' /tmp/frontier-google.json

          session="$(curl -fsS http://127.0.0.1:3000/api/auth/session)"
          echo "$session" | grep -q '"authenticated":false'

      - name: Install smoke-test browser
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture production browser fixtures
        run: |
          mkdir -p artifacts/browser-smoke
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/frontier artifacts/browser-smoke/frontier-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:3000/frontier artifacts/browser-smoke/frontier-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/physiology/visual-audit artifacts/browser-smoke/nature-atlas-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:3000/physiology/visual-audit artifacts/browser-smoke/nature-atlas-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/neural-net artifacts/browser-smoke/neural-net.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/perceptual-cortex artifacts/browser-smoke/perceptual-cortex.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/rotation artifacts/browser-smoke/rotation.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" --full-page http://127.0.0.1:3000/case-studies artifacts/browser-smoke/case-studies.png

      - name: Upload production audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-audit-artifacts
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
