name: Website CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: |
          npm ci
          mkdir -p artifacts/dependency-lock
          cp package-lock.json artifacts/dependency-lock/package-lock.json
      - name: Audit dependencies
        run: |
          mkdir -p artifacts/security
          npm audit --json > artifacts/security/npm-audit-all.json || true
          npm audit --omit=dev --json > artifacts/security/npm-audit-production.json || true
          npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Validate playable Sylvaria v0.15 runtime
        run: npm run check:mosslight
      - name: Profile Sylvaria playable runtime size
        run: npm run profile:sylvaria
      - name: Validate deterministic Nature Atlas corpus
        run: npm run check:nature-corpus
      - name: Audit 1000 World Loom scenes
        run: npm run check:world3d
      - name: Generate Next route and module bundle analysis
        run: |
          npx next experimental-analyze --output
          mkdir -p artifacts/bundle-analyzer
          cp -R .next/diagnostics/analyze/. artifacts/bundle-analyzer/
      - name: Build deterministic committed site state
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_WORLD_LOOM_XR: disabled
        run: npm run build
      - name: Enforce emitted JavaScript bundle budget
        run: npm run check:bundle
      - name: Start built site
        run: |
          npx next start -p 3000 > /tmp/sids-neural-net.log 2>&1 &
          echo $! > /tmp/sids-neural-net.pid
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sids-neural-net.log
          exit 1
      - name: Smoke public routes and Sylvaria v0.15 production modules
        run: |
          for route in / /neural-net /case-studies /physiology /perceptual-cortex /rotation /sensing-lab /physiology/visual-audit /photography /arcade /arcade/stretchicorn /arcade/unirico /arcade/sylvaria /arcade/mosslight; do
            echo "GET $route"
            curl --retry 2 --retry-connrefused -fsS "http://127.0.0.1:3000$route" >/dev/null
          done
          echo "GET pinned Stretchicorn runtime"
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/stretchicorn/index.html | grep -q '<canvas id="c"'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/stretchicorn/src/00-core.js | grep -q 'CORE WORLD + GEOMETRY'
          echo "GET pinned uniRico runtime"
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/unirico/index.html | grep -q '<canvas id="c"'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/unirico/runtime/core.js | grep -q 'use strict\|const\|function'

          SYL=http://127.0.0.1:3000/game-runtimes/mosslight-v2
          curl --retry 2 --retry-connrefused -fsS "$SYL/index.html" -o /tmp/sylvaria-index.html
          curl --retry 2 --retry-connrefused -fsS "$SYL/v015-entry.js" -o /tmp/sylvaria-v015-entry.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v015/cutstep-v015.js" -o /tmp/sylvaria-cutstep-v015.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v015/encounter-director-v015.js" -o /tmp/sylvaria-encounter-v015.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v015/forest-world-v015.js" -o /tmp/sylvaria-forest-v015.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v015/discoveries-v015.js" -o /tmp/sylvaria-discoveries-v015.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v015/forest-actors-v015.js" -o /tmp/sylvaria-actors-v015.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v015/cutstep-presentation-v015.js" -o /tmp/sylvaria-cutstep-presentation-v015.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v014/presentation-space-v014.js" -o /tmp/sylvaria-space-v014.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v014/enemy-flow-v014.js" -o /tmp/sylvaria-enemy-v014.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v014/boss-flow-v014.js" -o /tmp/sylvaria-boss-v014.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v014/threat-manager-v014.js" -o /tmp/sylvaria-threat-v014.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v011/competitive-v011.js" -o /tmp/sylvaria-competitive.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v013/replay-v013.js" -o /tmp/sylvaria-replay-v013.js

          grep -q 'Sylvaria · Cutstep Forest' /tmp/sylvaria-index.html
          grep -q './v015-entry.js' /tmp/sylvaria-index.html
          grep -q 'SPACE or click instantly Cutsteps' /tmp/sylvaria-index.html
          grep -q 'There is no charge delay' /tmp/sylvaria-index.html
          grep -q 'forest regrows behind you' /tmp/sylvaria-index.html
          if grep -q '<script type="module" src="./v014-entry.js"' /tmp/sylvaria-index.html; then
            echo "public shell still boots v0.14 directly" >&2
            exit 1
          fi
          for module in cutstep-v015 encounter-director-v015 forest-world-v015 discoveries-v015 forest-actors-v015 cutstep-presentation-v015; do grep -q "$module.js" /tmp/sylvaria-v015-entry.js; done
          grep -q "SylvariaRankedDisabledReason='v0.15 Cutstep alpha · verifier migration required'" /tmp/sylvaria-v015-entry.js
          grep -q 'maxSegments:3' /tmp/sylvaria-cutstep-v015.js
          grep -q 'distance:86' /tmp/sylvaria-cutstep-v015.js
          grep -q 'bladeLead:14' /tmp/sylvaria-cutstep-v015.js
          grep -q "kind:'thrust'" /tmp/sylvaria-cutstep-v015.js
          grep -q "kind:'crosscut'" /tmp/sylvaria-cutstep-v015.js
          grep -q "kind:'reversal'" /tmp/sylvaria-cutstep-v015.js
          grep -q 'F.beginDashCharge=()=>false;F.releaseDashCharge=()=>false' /tmp/sylvaria-cutstep-v015.js
          grep -q "room('The Walking Sawmill'" /tmp/sylvaria-encounter-v015.js
          grep -q 'state.enemies.length=0' /tmp/sylvaria-encounter-v015.js
          grep -q 'Math.min(7,4+Math.floor((depth-13)/4))' /tmp/sylvaria-encounter-v015.js
          grep -q 'moonflower' /tmp/sylvaria-discoveries-v015.js
          grep -q 'spirit-stag' /tmp/sylvaria-discoveries-v015.js
          grep -q 'root-shrine' /tmp/sylvaria-discoveries-v015.js
          grep -q "canvas.id='actorCanvas'" /tmp/sylvaria-actors-v015.js
          grep -q 'drawGuardian' /tmp/sylvaria-actors-v015.js
          grep -q 'drawHarvester' /tmp/sylvaria-actors-v015.js
          grep -q 'mist-pine' /tmp/sylvaria-forest-v015.js
          grep -q 'oak-hollow' /tmp/sylvaria-forest-v015.js
          grep -q 'cedar-gloom' /tmp/sylvaria-forest-v015.js
          grep -q 'ancient-grove' /tmp/sylvaria-forest-v015.js
          grep -q 'drawBrushFog' /tmp/sylvaria-forest-v015.js
          grep -q "overlay.id='cutstepCanvas'" /tmp/sylvaria-cutstep-presentation-v015.js
          grep -q "'forestCanvas','actorCanvas','kineticCanvas','flowCanvas','cutstepCanvas'" /tmp/sylvaria-space-v014.js
          grep -q 'spec.dodge=100' /tmp/sylvaria-enemy-v014.js
          grep -q 'guardByPhase:Object.freeze({1:3,2:4,3:5})' /tmp/sylvaria-boss-v014.js
          grep -q 'ROOM_THREAT_PROFILES' /tmp/sylvaria-threat-v014.js
          grep -q 'window.SylvariaRankedDisabledReason' /tmp/sylvaria-competitive.js
          grep -q "VERSION='0.13.0'" /tmp/sylvaria-replay-v013.js

          echo "GET leaderboard in intentionally unconfigured CI deployment"
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/api/sylvaria/leaderboard | grep -q '"configured":false'
          ticket_status="$(curl -sS -o /tmp/sylvaria-ticket.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/sylvaria/run-ticket)"
          test "$ticket_status" = "503"
          grep -q '"configured":false' /tmp/sylvaria-ticket.json
      - name: Install cross-browser smoke engines
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium firefox webkit
          npx --yes playwright@1.55.0 install chrome
      - name: Validate homepage Game Network CTA
        run: |
          PW_BIN="$(npm exec --yes --package=playwright@1.55.0 -- which playwright)"
          PW_ROOT="$(cd "$(dirname "$PW_BIN")/.." && pwd)"
          PLAYWRIGHT_MODULE_ROOT="$PW_ROOT" node scripts/playtest-arcade-home.mjs
      - name: Validate Sylvaria v0.15 across Chrome Stable Chromium Firefox and WebKit
        run: |
          PW_BIN="$(npm exec --yes --package=playwright@1.55.0 -- which playwright)"
          PW_ROOT="$(cd "$(dirname "$PW_BIN")/.." && pwd)"
          PLAYWRIGHT_MODULE_ROOT="$PW_ROOT" node scripts/playtest-sylvaria-v015-browsers.mjs
      - name: Playtest Sylvaria v0.15 immediate Cutstep forest loop
        run: |
          PW_BIN="$(npm exec --yes --package=playwright@1.55.0 -- which playwright)"
          PW_ROOT="$(cd "$(dirname "$PW_BIN")/.." && pwd)"
          PLAYWRIGHT_MODULE_ROOT="$PW_ROOT" node scripts/playtest-sylvaria-v015-cutstep.mjs
      - name: Playtest Sylvaria v0.15 escalating combat alpha
        run: |
          PW_BIN="$(npm exec --yes --package=playwright@1.55.0 -- which playwright)"
          PW_ROOT="$(cd "$(dirname "$PW_BIN")/.." && pwd)"
          PLAYWRIGHT_MODULE_ROOT="$PW_ROOT" node scripts/playtest-sylvaria-v015-alpha-progression.mjs
      - name: Capture production browser fixtures
        run: |
          mkdir -p artifacts/browser-smoke
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/ artifacts/browser-smoke/home-game-network-cta-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" http://127.0.0.1:3000/ artifacts/browser-smoke/home-game-network-cta-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/physiology/visual-audit artifacts/browser-smoke/nature-atlas-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:3000/physiology/visual-audit artifacts/browser-smoke/nature-atlas-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/neural-net artifacts/browser-smoke/neural-net.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/perceptual-cortex artifacts/browser-smoke/perceptual-cortex.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/rotation artifacts/browser-smoke/rotation.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/case-studies artifacts/browser-smoke/case-studies.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/photography artifacts/browser-smoke/visual-cortex.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/arcade artifacts/browser-smoke/game-network.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/arcade/sylvaria artifacts/browser-smoke/arcade-sylvaria-v015.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1920,1080" http://127.0.0.1:3000/game-runtimes/mosslight-v2/index.html artifacts/browser-smoke/sylvaria-v015-widescreen.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" http://127.0.0.1:3000/game-runtimes/mosslight-v2/index.html artifacts/browser-smoke/sylvaria-v015-portrait.png
      - name: Upload production audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-audit-artifacts
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
