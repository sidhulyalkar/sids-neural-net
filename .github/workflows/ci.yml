name: Website CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: |
          npm ci
          mkdir -p artifacts/dependency-lock
          cp package-lock.json artifacts/dependency-lock/package-lock.json
      - name: Audit dependencies
        run: |
          mkdir -p artifacts/security
          npm audit --json > artifacts/security/npm-audit-all.json || true
          npm audit --omit=dev --json > artifacts/security/npm-audit-production.json || true
          npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Validate current Sylvaria v3.1 runtime
        run: npm run check:sylvaria
      - name: Profile current Sylvaria playable runtime size
        run: npm run profile:sylvaria
      - name: Validate deterministic Nature Atlas corpus
        run: npm run check:nature-corpus
      - name: Audit 1000 World Loom scenes
        run: npm run check:world3d
      - name: Generate Next route and module bundle analysis
        run: |
          npx next experimental-analyze --output
          mkdir -p artifacts/bundle-analyzer
          cp -R .next/diagnostics/analyze/. artifacts/bundle-analyzer/
      - name: Build deterministic committed site state
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_WORLD_LOOM_XR: disabled
        run: npm run build
      - name: Enforce emitted JavaScript bundle budget
        run: npm run check:bundle
      - name: Start built site
        run: |
          npx next start -p 3000 > /tmp/sids-neural-net.log 2>&1 &
          echo $! > /tmp/sids-neural-net.pid
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sids-neural-net.log
          exit 1
      - name: Smoke public routes and current game runtimes
        run: |
          for route in / /neural-net /case-studies /physiology /perceptual-cortex /rotation /sensing-lab /physiology/visual-audit /photography /arcade /arcade/stretchicorn /arcade/unirico /arcade/sylvaria /arcade/mosslight; do
            echo "GET $route"
            curl --retry 2 --retry-connrefused -fsS "http://127.0.0.1:3000$route" >/dev/null
          done

          echo "GET pinned Stretchicorn runtime"
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/stretchicorn/index.html | grep -q '<canvas id="c"'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/stretchicorn/src/00-core.js | grep -q 'CORE WORLD + GEOMETRY'

          echo "GET pinned uniRico runtime"
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/unirico/index.html | grep -q '<canvas id="c"'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/unirico/runtime/core.js | grep -q 'use strict\|const\|function'

          echo "GET current Sylvaria v3.1 runtime"
          SYL=http://127.0.0.1:3000/game-runtimes/sylvaria-v3
          curl --retry 2 --retry-connrefused -fsS "$SYL/index.html" -o /tmp/sylvaria-v31-index.html
          curl --retry 2 --retry-connrefused -fsS "$SYL/config-v3.js" -o /tmp/sylvaria-v31-config.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/world-v3.js" -o /tmp/sylvaria-v31-world.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/engine-sapline-v3.js" -o /tmp/sylvaria-v31-sapline.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/render-motion-v3.js" -o /tmp/sylvaria-v31-motion.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/game-v3.js" -o /tmp/sylvaria-v31-game.js
          grep -q 'ANCIENT TREE ASCENT' /tmp/sylvaria-v31-index.html
          grep -q 'hold Sapline' /tmp/sylvaria-v31-index.html
          grep -q "VERSION='3.1.0-alpha.1'" /tmp/sylvaria-v31-config.js
          grep -q "tether:'KeyW'" /tmp/sylvaria-v31-config.js
          grep -q 'spring:23.5' /tmp/sylvaria-v31-config.js
          grep -q 'SAPLINE_ANCHORS' /tmp/sylvaria-v31-world.js
          grep -q 'knot-canopy' /tmp/sylvaria-v31-world.js
          grep -q 'updateSapline' /tmp/sylvaria-v31-sapline.js
          grep -q 'releaseSapline' /tmp/sylvaria-v31-sapline.js
          grep -q 'drawSapline' /tmp/sylvaria-v31-motion.js
          grep -q 'if(!attack)' /tmp/sylvaria-v31-motion.js
          grep -q 'engine-sapline-v3.js' /tmp/sylvaria-v31-game.js
          grep -q 'render-motion-v3.js' /tmp/sylvaria-v31-game.js

          echo "GET leaderboard in intentionally unconfigured CI deployment"
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/api/sylvaria/leaderboard | grep -q '"configured":false'
          ticket_status="$(curl -sS -o /tmp/sylvaria-ticket.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/sylvaria/run-ticket)"
          test "$ticket_status" = "503"
          grep -q '"configured":false' /tmp/sylvaria-ticket.json
      - name: Install cross-browser smoke engines
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium firefox webkit
          npx --yes playwright@1.55.0 install chrome
      - name: Validate homepage Game Network CTA
        run: |
          PW_BIN="$(npm exec --yes --package=playwright@1.55.0 -- which playwright)"
          PW_ROOT="$(cd "$(dirname "$PW_BIN")/.." && pwd)"
          PLAYWRIGHT_MODULE_ROOT="$PW_ROOT" node scripts/playtest-arcade-home.mjs
      - name: Validate Sylvaria v3.1 across Chrome Stable Chromium Firefox and WebKit
        run: |
          PW_BIN="$(npm exec --yes --package=playwright@1.55.0 -- which playwright)"
          PW_ROOT="$(cd "$(dirname "$PW_BIN")/.." && pwd)"
          PLAYWRIGHT_MODULE_ROOT="$PW_ROOT" node scripts/playtest-sylvaria-v3-browsers.mjs
      - name: Playtest Sylvaria v3.1 ancient-tree movement combat and Sapline
        run: |
          PW_BIN="$(npm exec --yes --package=playwright@1.55.0 -- which playwright)"
          PW_ROOT="$(cd "$(dirname "$PW_BIN")/.." && pwd)"
          PLAYWRIGHT_MODULE_ROOT="$PW_ROOT" node scripts/playtest-sylvaria-v3-ascent.mjs
      - name: Capture production browser fixtures
        run: |
          mkdir -p artifacts/browser-smoke
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/ artifacts/browser-smoke/home-game-network-cta-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" http://127.0.0.1:3000/ artifacts/browser-smoke/home-game-network-cta-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/physiology/visual-audit artifacts/browser-smoke/nature-atlas-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:3000/physiology/visual-audit artifacts/browser-smoke/nature-atlas-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/neural-net artifacts/browser-smoke/neural-net.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/perceptual-cortex artifacts/browser-smoke/perceptual-cortex.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/rotation artifacts/browser-smoke/rotation.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/case-studies artifacts/browser-smoke/case-studies.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/photography artifacts/browser-smoke/visual-cortex.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/arcade artifacts/browser-smoke/game-network.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/arcade/sylvaria artifacts/browser-smoke/arcade-sylvaria-v31.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1920,1080" http://127.0.0.1:3000/game-runtimes/sylvaria-v3/index.html artifacts/browser-smoke/sylvaria-v31-widescreen.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" http://127.0.0.1:3000/game-runtimes/sylvaria-v3/index.html artifacts/browser-smoke/sylvaria-v31-portrait.png
      - name: Upload production audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-audit-artifacts
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
