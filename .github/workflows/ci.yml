name: Website CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install exact locked dependencies
        run: |
          npm ci
          mkdir -p artifacts/dependency-lock
          cp package-lock.json artifacts/dependency-lock/package-lock.json

      - name: Audit dependencies
        run: |
          mkdir -p artifacts/security
          npm audit --json > artifacts/security/npm-audit-all.json || true
          npm audit --omit=dev --json > artifacts/security/npm-audit-production.json || true
          npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate Sylvaria v0.13 kinetic runtime
        run: npm run check:mosslight

      - name: Profile Sylvaria readable runtime size
        run: npm run profile:sylvaria

      - name: Validate deterministic Nature Atlas corpus
        run: npm run check:nature-corpus

      - name: Audit 1000 World Loom scenes
        run: npm run check:world3d

      - name: Generate Next route and module bundle analysis
        run: |
          npx next experimental-analyze --output
          mkdir -p artifacts/bundle-analyzer
          cp -R .next/diagnostics/analyze/. artifacts/bundle-analyzer/

      - name: Build deterministic committed site state
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_WORLD_LOOM_XR: disabled
        run: npm run build

      - name: Enforce emitted JavaScript bundle budget
        run: npm run check:bundle

      - name: Start built site
        run: |
          npx next start -p 3000 > /tmp/sids-neural-net.log 2>&1 &
          echo $! > /tmp/sids-neural-net.pid
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sids-neural-net.log
          exit 1

      - name: Smoke public production routes and Sylvaria v0.13 modules
        run: |
          for route in / /neural-net /case-studies /physiology /perceptual-cortex /rotation /sensing-lab /physiology/visual-audit /photography /arcade /arcade/stretchicorn /arcade/unirico /arcade/sylvaria /arcade/mosslight; do
            echo "GET $route"
            curl --retry 2 --retry-connrefused -fsS "http://127.0.0.1:3000$route" >/dev/null
          done
          echo "GET pinned Stretchicorn runtime"
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/stretchicorn/index.html | grep -q '<canvas id="c"'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/stretchicorn/src/00-core.js | grep -q 'CORE WORLD + GEOMETRY'
          echo "GET pinned uniRico runtime"
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/unirico/index.html | grep -q '<canvas id="c"'
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/game-runtimes/unirico/runtime/core.js | grep -q 'use strict\|const\|function'

          echo "GET Sylvaria v0.13 kinetic runtime"
          SYL=http://127.0.0.1:3000/game-runtimes/mosslight-v2
          curl --retry 2 --retry-connrefused -fsS "$SYL/index.html" -o /tmp/sylvaria-index.html
          curl --retry 2 --retry-connrefused -fsS "$SYL/v013-entry.js" -o /tmp/sylvaria-v013-entry.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v013/kinetic-combat-v013.js" -o /tmp/sylvaria-kinetics.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v013/enemy-ai-v013.js" -o /tmp/sylvaria-ai.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v013/replay-v013.js" -o /tmp/sylvaria-replay-v013.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v013/coach-v013.js" -o /tmp/sylvaria-coach-v013.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v013/kinetic-presentation-v013.js" -o /tmp/sylvaria-kinetic-presentation.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v012-entry.js" -o /tmp/sylvaria-v012-entry.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v012/webgl-pond-v012.js" -o /tmp/sylvaria-pond.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v012/art-atlas-pro-v012.js" -o /tmp/sylvaria-atlas.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v011/rooms-v011.js" -o /tmp/sylvaria-rooms-v011.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v011/competitive-v011.js" -o /tmp/sylvaria-competitive-v011.js
          curl --retry 2 --retry-connrefused -fsS "$SYL/v091/synergy-v010.js" -o /tmp/sylvaria-synergy.js
          for moduleName in model world movement battle-core render boot fullscreen; do
            curl --retry 2 --retry-connrefused -fsS "$SYL/v091/$moduleName.js" -o "/tmp/sylvaria-$moduleName.js"
          done
          grep -q 'v0.13 · kinetic arc combat' /tmp/sylvaria-index.html
          grep -q 'Glide. Charge. Sweep. Return fire.' /tmp/sylvaria-index.html
          grep -q './v013-entry.js' /tmp/sylvaria-index.html
          grep -q 'id="rankPanel"' /tmp/sylvaria-index.html
          grep -q 'id="rankedSubmit"' /tmp/sylvaria-index.html
          if grep -q '<script type="module" src="./v012-entry.js"\|<script type="module" src="./v091/boot.js"' /tmp/sylvaria-index.html; then
            echo "v0.13 shell bypassed its current entrypoint" >&2
            exit 1
          fi
          grep -q "v013/kinetic-combat-v013.js" /tmp/sylvaria-v013-entry.js
          grep -q "v013/enemy-ai-v013.js" /tmp/sylvaria-v013-entry.js
          grep -q "v013/replay-v013.js" /tmp/sylvaria-v013-entry.js
          grep -q 'continuousGlide:true' /tmp/sylvaria-v013-entry.js
          grep -q 'chargedOmniDash:true' /tmp/sylvaria-v013-entry.js
          grep -q 'kineticTongueArc:true' /tmp/sylvaria-v013-entry.js
          grep -q 'predictiveArcEvasion:true' /tmp/sylvaria-v013-entry.js
          grep -q 'moveSpeed:238' /tmp/sylvaria-kinetics.js
          grep -q 'dashMaxSpeed:960' /tmp/sylvaria-kinetics.js
          grep -q 'arcDegrees:156' /tmp/sylvaria-kinetics.js
          grep -q 'perfectReflectSpeed:1120' /tmp/sylvaria-kinetics.js
          grep -q 'function beginDashCharge' /tmp/sylvaria-kinetics.js
          grep -q 'function arcSweepContains' /tmp/sylvaria-kinetics.js
          grep -q 'function counterShotArc' /tmp/sylvaria-kinetics.js
          grep -q 'skimmer:' /tmp/sylvaria-ai.js
          grep -q 'strider:' /tmp/sylvaria-ai.js
          grep -q 'sniper:' /tmp/sylvaria-ai.js
          grep -q 'shellback:' /tmp/sylvaria-ai.js
          grep -q 'function maybeReadArc' /tmp/sylvaria-ai.js
          grep -q 'SCHEMA=2' /tmp/sylvaria-replay-v013.js
          grep -q 'space:\[12,13\]' /tmp/sylvaria-replay-v013.js
          grep -q 'WASD · glide freely' /tmp/sylvaria-coach-v013.js
          grep -q 'function drawArcAttack' /tmp/sylvaria-kinetic-presentation.js
          grep -q "PRESENTATION='0.12.0',ENGINE='0.11.1'" /tmp/sylvaria-v012-entry.js
          grep -q "getContext('webgl2'" /tmp/sylvaria-pond.js
          grep -q 'function frog' /tmp/sylvaria-atlas.js
          grep -q 'ROOMS_V011' /tmp/sylvaria-rooms-v011.js
          grep -q '/api/sylvaria/run-ticket' /tmp/sylvaria-competitive-v011.js
          grep -q "VERSION='0.9.1'" /tmp/sylvaria-model.js
          grep -q 'FIXED_DT=1/120' /tmp/sylvaria-model.js
          grep -q 'MAX_SHOTS=128' /tmp/sylvaria-model.js
          grep -q 'MAX_PENDING=72' /tmp/sylvaria-model.js
          grep -q 'function triggerReturnEcology' /tmp/sylvaria-synergy.js
          grep -q 'function hazardScoreAt' /tmp/sylvaria-synergy.js
          grep -q 'function bulldozeBoss' /tmp/sylvaria-synergy.js

          echo "GET v0.13 leaderboard in intentionally unconfigured CI deployment"
          curl --retry 2 --retry-connrefused -fsS http://127.0.0.1:3000/api/sylvaria/leaderboard | grep -q '"configured":false'
          ticket_status="$(curl -sS -o /tmp/sylvaria-ticket.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/sylvaria/run-ticket)"
          test "$ticket_status" = "503"
          grep -q '"configured":false' /tmp/sylvaria-ticket.json

      - name: Install cross-browser smoke engines
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium firefox webkit
          npx --yes playwright@1.55.0 install chrome

      - name: Validate homepage Game Network CTA
        run: |
          PW_BIN="$(npm exec --yes --package=playwright@1.55.0 -- which playwright)"
          PW_ROOT="$(cd "$(dirname "$PW_BIN")/.." && pwd)"
          PLAYWRIGHT_MODULE_ROOT="$PW_ROOT" node scripts/playtest-arcade-home.mjs

      - name: Validate Sylvaria v0.13 across Chrome Stable Chromium Firefox and WebKit
        run: |
          PW_BIN="$(npm exec --yes --package=playwright@1.55.0 -- which playwright)"
          PW_ROOT="$(cd "$(dirname "$PW_BIN")/.." && pwd)"
          PLAYWRIGHT_MODULE_ROOT="$PW_ROOT" node scripts/playtest-sylvaria-browsers.mjs

      - name: Verify Sylvaria v0.13 browser to Node replay parity
        run: |
          PW_BIN="$(npm exec --yes --package=playwright@1.55.0 -- which playwright)"
          PW_ROOT="$(cd "$(dirname "$PW_BIN")/.." && pwd)"
          PLAYWRIGHT_MODULE_ROOT="$PW_ROOT" node --import tsx scripts/playtest-sylvaria-replay-parity.mjs

      - name: Playtest Sylvaria v0.13 kinetic combat
        run: |
          PW_BIN="$(npm exec --yes --package=playwright@1.55.0 -- which playwright)"
          PW_ROOT="$(cd "$(dirname "$PW_BIN")/.." && pwd)"
          PLAYWRIGHT_MODULE_ROOT="$PW_ROOT" node scripts/playtest-sylvaria-v013-kinetics.mjs

      - name: Playtest Sylvaria v0.13 controls coaching and competitive loop
        run: |
          PW_BIN="$(npm exec --yes --package=playwright@1.55.0 -- which playwright)"
          PW_ROOT="$(cd "$(dirname "$PW_BIN")/.." && pwd)"
          PLAYWRIGHT_MODULE_ROOT="$PW_ROOT" node scripts/playtest-sylvaria-competitive.mjs

      - name: Capture production browser fixtures
        run: |
          mkdir -p artifacts/browser-smoke
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/ artifacts/browser-smoke/home-game-network-cta-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" http://127.0.0.1:3000/ artifacts/browser-smoke/home-game-network-cta-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/physiology/visual-audit artifacts/browser-smoke/nature-atlas-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:3000/physiology/visual-audit artifacts/browser-smoke/nature-atlas-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/neural-net artifacts/browser-smoke/neural-net.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/perceptual-cortex artifacts/browser-smoke/perceptual-cortex.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/rotation artifacts/browser-smoke/rotation.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/case-studies artifacts/browser-smoke/case-studies.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/photography artifacts/browser-smoke/visual-cortex.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1100" --full-page http://127.0.0.1:3000/arcade artifacts/browser-smoke/game-network.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/arcade/stretchicorn artifacts/browser-smoke/arcade-stretchicorn.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/arcade/unirico artifacts/browser-smoke/arcade-unirico.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" http://127.0.0.1:3000/arcade/sylvaria artifacts/browser-smoke/arcade-sylvaria-v013.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1920,1080" http://127.0.0.1:3000/game-runtimes/mosslight-v2/index.html artifacts/browser-smoke/sylvaria-v013-widescreen.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" http://127.0.0.1:3000/game-runtimes/mosslight-v2/index.html artifacts/browser-smoke/sylvaria-v013-portrait.png

      - name: Upload production audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-audit-artifacts
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
