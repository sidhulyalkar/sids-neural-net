    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10241f;color:#fff3cf;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}body{display:grid;place-items:center;overscroll-behavior:none}#wrap{position:relative;width:min(100vw,calc(100vh * 1.5));aspect-ratio:3/2;background:#10241f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}#c{display:block;width:100%;height:100%;outline:0;background:#10241f;image-rendering:auto}#hint{position:absolute;right:10px;bottom:7px;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,244,216,.24);pointer-events:none;transition:opacity .25s}#wrap[data-playing="true"] #hint{opacity:.08}@media(pointer:coarse){#hint{display:none}}
