<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 960" width="1600" height="960">
<title>MindForge: a hand-lettered synapse and brain street mural</title>
<defs>
<linearGradient id="brain" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a99df3"/><stop offset=".33" stop-color="#dc92ef"/><stop offset=".75" stop-color="#76dddf"/><stop offset="1" stop-color="#99ffe0"/></linearGradient>
<linearGradient id="letter" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdfae"/><stop offset=".49" stop-color="#efe6e2"/><stop offset="1" stop-color="#89cde8"/></linearGradient>
<radialGradient id="haze"><stop stop-color="#7a36bc" stop-opacity=".57"/><stop offset=".54" stop-color="#38528a" stop-opacity=".28"/><stop offset="1" stop-color="#13263b" stop-opacity="0"/></radialGradient>
<filter id="halo" x="-25%" y="-45%" width="150%" height="190%"><feGaussianBlur stdDeviation="13"/></filter>
<pattern id="flecks" width="44" height="52" patternUnits="userSpaceOnUse"><path d="M6 8l9 -4 M29 38l5 -9" fill="none" stroke="#121b31" stroke-width="3" stroke-linecap="round" opacity=".48"/></pattern>
</defs>
<ellipse cx="768" cy="510" rx="645" ry="375" fill="url(#haze)"/>
<g opacity=".53" fill="none" stroke="#57d6e2" stroke-width="20" filter="url(#halo)">
<path d="M375 550Q180 570 128 420 M1060 500Q1280 414 1459 460 M678 250Q678 98 780 56"/>
</g>
<!-- Large authored lettering establishes hierarchy -->
<g font-family="Impact,Arial Black,sans-serif" font-weight="900" text-anchor="middle" paint-order="stroke" stroke-linejoin="round">
<text x="795" y="160" font-size="142" letter-spacing="1" fill="#192331" stroke="#101825" stroke-width="37">MIND FORGE</text>
<text x="795" y="150" font-size="142" letter-spacing="1" fill="url(#letter)" stroke="#446879" stroke-width="15">MIND FORGE</text>
<text x="800" y="913" font-size="58" letter-spacing="9" fill="#beece8" stroke="#09262e" stroke-width="12">NEUROSCIENCE  /  ENGINEERING</text>
</g>
<!-- Brain silhouettes are FILLED paint masses; broad contour strokes read at distance. -->
<g transform="translate(134 102)">
<path d="M640 667C539 732 468 685 430 617C322 645 225 570 238 478C176 433 185 337 244 296C221 203 291 124 381 130C430 47 532 31 617 84C643 60 669 58 692 83L698 617Z" fill="#161c3a" opacity=".95"/>
