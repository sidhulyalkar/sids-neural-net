<path d="M705 117C802 54 883 94 902 172C1007 147 1092 226 1045 308C1140 364 1085 475 1019 488C1054 573 956 650 882 591C837 684 747 667 700 619Z" fill="url(#brain)" stroke="#95e8e7" stroke-width="15" stroke-linejoin="round"/>
