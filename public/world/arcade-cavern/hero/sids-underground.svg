<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 280" width="2048" height="280" role="img" aria-label="Sid's Underground graffiti mural">
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8d4"/><stop offset=".57" stop-color="#f9d8a8"/><stop offset="1" stop-color="#fb9974"/></linearGradient>
 <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2=".7"><stop offset="0" stop-color="#8ef5dd"/><stop offset=".28" stop-color="#9de3f7"/><stop offset=".63" stop-color="#d5afff"/><stop offset="1" stop-color="#ffb3d0"/></linearGradient>
 <filter id="soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
 <pattern id="grain" width="87" height="63" patternUnits="userSpaceOnUse"><path d="M4 18l9 -5 M39 4l-6 12 M72 49l11 -4" stroke="#090e15" stroke-width="3" opacity=".28"/><circle cx="27" cy="44" r="2.5" fill="#15151c" opacity=".35"/></pattern>
</defs>
<!-- Only ink has alpha; the dark basalt remains fully visible behind it. -->
<g opacity=".28" fill="none" stroke="#72ebe7" stroke-width="9" stroke-linecap="round">
 <path d="M50 220Q124 191 176 236L232 208 M1799 230Q1890 185 1962 223"/>
 <path d="M244 48l40 -20 38 10 M1726 44l44 -20 58 12"/>
</g>
<!-- Underpaint halos and their irregular spray borders -->
<g fill="none" stroke="#6cc8d6" stroke-width="18" opacity=".36" filter="url(#soft)">
 <path d="M80 137Q476 48 1032 90T1970 129"/>
</g>
<g fill="none" stroke-linejoin="round" stroke-linecap="round">
 <path d="M44 188l40 -10 22 24 25 -32 40 18 M1897 195l32 -37 42 39 35 -13" stroke="#79b5c1" stroke-width="7" opacity=".75"/>
 <path d="M327 231l-21 18 m-85 -10l-13 11 m153 -15l12 17 M1632 239l18 15m76 -22l20 18" stroke="#ffa5bd" stroke-width="6"/>
</g>
<!-- The dominant type is block-filled, not a collection of wire outlines. -->
<g text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-stretch="condensed" font-weight="900" paint-order="stroke" stroke-linejoin="round">
 <text x="1029" y="197" font-size="215" fill="#071a22" stroke="#06131e" stroke-width="52" letter-spacing="3">SID'S UNDERGROUND</text>
 <text x="1024" y="179" font-size="215" fill="url(#rainbow)" stroke="#236879" stroke-width="32" letter-spacing="3">SID'S UNDERGROUND</text>
 <text x="1024" y="173" font-size="215" fill="url(#gold)" stroke="#f4e8cd" stroke-width="8" letter-spacing="3">SID'S UNDERGROUND</text>
 <text x="1024" y="173" font-size="215" fill="url(#grain)" stroke="none" letter-spacing="3">SID'S UNDERGROUND</text>
</g>
<g stroke-linecap="round">
 <path d="M84 211Q175 228 248 216" fill="none" stroke="#ef9fb7" stroke-width="7"/>
 <path d="M1784 215Q1889 232 1972 207" fill="none" stroke="#7ce6e1" stroke-width="7"/>
 <path d="M524 222l-4 19m17 -24l-2 33 M1447 216l4 32m27 -33l-2 24" stroke="#ebac9d" stroke-width="8"/>
</g>
<g fill="#94ddd5" opacity=".75"><circle cx="118" cy="65" r="5"/><circle cx="157" cy="46" r="3"/><circle cx="1863" cy="66" r="5"/><circle cx="1910" cy="54" r="3"/></g>
</svg>