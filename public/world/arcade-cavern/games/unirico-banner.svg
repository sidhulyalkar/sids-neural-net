    <text x="750" y="222" font-family="Trebuchet MS,Arial,sans-serif" font-size="43" font-weight="800" letter-spacing="3" fill="#ff8bc8" stroke="#fff3ff" stroke-width="3">RAINBOW RICOCHET</text>
    <text x="750" y="270" font-family="Trebuchet MS,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8f3ff">The sky got grumpy. You have a horn. Fix it.</text>
