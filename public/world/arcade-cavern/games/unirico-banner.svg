<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">uniRico — Rainbow Ricochet</title>
  <desc id="desc">A wide three-to-one banner showing a unicorn firing a rainbow ricochet through a magical sky toward a grumpy cloud that becomes happy.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173f73"/>
      <stop offset=".56" stop-color="#356da9"/>
      <stop offset="1" stop-color="#7f9ac8"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff646c"/>
      <stop offset=".17" stop-color="#ffb653"/>
      <stop offset=".34" stop-color="#ffe95f"/>
      <stop offset=".51" stop-color="#70e968"/>
      <stop offset=".68" stop-color="#52e4d5"/>
      <stop offset=".84" stop-color="#70a7ff"/>
      <stop offset="1" stop-color="#bd78ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

