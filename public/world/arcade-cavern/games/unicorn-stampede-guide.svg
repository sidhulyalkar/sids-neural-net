<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="t d">
<title id="t">Unicorn Stampede competitive how-to-play guide</title>
<desc id="d">Clean visual guide for Blue route planning, Yellow Prism Chase, six-unicorn orchestration, competitive scoring, Town Hall chaos gating, and world progression.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07142d"/><stop offset=".55" stop-color="#17152f"/><stop offset="1" stop-color="#441738"/></linearGradient>
