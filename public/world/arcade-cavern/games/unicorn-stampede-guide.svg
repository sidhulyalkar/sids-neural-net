<path d="M78 365 C150 320 232 422 372 350" fill="none" stroke="#73dfff" stroke-width="8" stroke-dasharray="15 12" class="R"/><path d="M355 341 382 350 361 370" fill="none" stroke="#73dfff" stroke-width="8" class="R"/>
<line x1="70" y1="400" x2="414" y2="400" stroke="#fff" stroke-opacity=".09"/><text x="72" y="430" class="B">Release the final WASD key.</text><text x="72" y="456" class="B">That unicorn keeps running its route.</text><text x="72" y="482" class="M">Set useful motion, then spend attention elsewhere.</text>
<!-- center -->
<rect x="465" y="135" width="470" height="365" rx="28" fill="url(#p)" stroke="#a785ff" stroke-width="2"/>
<text x="700" y="174" class="L C">THE REAL GAME</text><text x="700" y="210" class="P C">BUILD MOMENTUM</text><text x="700" y="233" class="M C">NOT MICROMANAGEMENT</text>
<g transform="translate(515 264)"><circle cx="34" cy="20" r="25" fill="#73dfff"/><circle cx="78" cy="20" r="25" fill="#ffe56d"/><text x="56" y="83" class="N C">2</text><text x="56" y="105" class="M C">learn</text><path d="M116 20h44" stroke="#fff" stroke-width="4"/><path d="m151 11 13 9-13 9" fill="none" stroke="#fff" stroke-width="4"/>
<g transform="translate(185)"><circle cx="0" cy="2" r="17" fill="#73dfff"/><circle cx="38" cy="2" r="17" fill="#73dfff" opacity=".6"/><circle cx="0" cy="40" r="17" fill="#ffe56d"/><circle cx="38" cy="40" r="17" fill="#ffe56d" opacity=".6"/><text x="19" y="88" class="N C">4</text><text x="19" y="110" class="M C">switch</text></g><path d="M250 20h44" stroke="#fff" stroke-width="4"/><path d="m285 11 13 9-13 9" fill="none" stroke="#fff" stroke-width="4"/>
<g transform="translate(320 3)"><circle cx="0" cy="0" r="12" fill="#73dfff"/><circle cx="29" cy="0" r="12" fill="#73dfff" opacity=".7"/><circle cx="58" cy="0" r="12" fill="#73dfff" opacity=".45"/><circle cx="0" cy="34" r="12" fill="#ffe56d"/><circle cx="29" cy="34" r="12" fill="#ffe56d" opacity=".7"/><circle cx="58" cy="34" r="12" fill="#ffe56d" opacity=".45"/><text x="29" y="85" class="N C">6</text><text x="29" y="107" class="M C">orchestrate</text></g></g>
<line x1="495" y1="390" x2="905" y2="390" stroke="#fff" stroke-opacity=".09"/><text x="700" y="420" class="B C">Keep several unicorns ACTIVE at the same time.</text><text x="700" y="447" class="B C">More ACTIVE = more paint, more opportunities, more pressure.</text><rect x="555" y="466" width="290" height="22" rx="11" fill="#27304a"/><rect x="555" y="466" width="238" height="22" rx="11" fill="url(#r)"/><text x="700" y="482" class="M C" style="fill:#fff">ACTIVE 5 / 6</text>
<!-- yellow -->
<rect x="960" y="135" width="395" height="365" rx="28" fill="url(#p)" stroke="#ffe56d" stroke-width="2"/>
<text x="988" y="174" class="L">YELLOW ROSTER • PRISM CHASE</text><text x="988" y="210" class="P">AIM BESIDE → CLICK ×3</text>
<g transform="translate(1195 294)"><ellipse rx="37" ry="22" fill="#fff"/><circle cx="35" cy="-18" r="17" fill="#fff"/><path d="M41-32 57-70 51-26" fill="#ffe56d"/><path d="M-34 0 Q-67 2-91 25" fill="none" stroke="#ffe56d" stroke-width="12" class="R"/><circle cx="40" cy="-21" r="3" fill="#10182b"/></g><circle cx="1195" cy="294" r="82" fill="none" stroke="#ffe56d" stroke-width="4" stroke-dasharray="14 10" opacity=".6"/>
<g transform="translate(1044 266) rotate(-18)" filter="url(#g)"><path d="M0 18a34 34 0 1 1 45 48" fill="none" stroke="#ff6489" stroke-width="12" class="R"/><path d="M7 18a27 27 0 1 1 36 25" fill="none" stroke="#ffe56d" stroke-width="8" class="R"/><path d="M14 18a20 20 0 1 1 26 20" fill="none" stroke="#64dcff" stroke-width="4" class="R"/><path d="M-8 18H8M0 10v16" stroke="#fff" stroke-width="3" class="R"/></g><path d="M1082 304 Q1134 250 1181 291" fill="none" stroke="url(#r)" stroke-width="9" class="R"/>
<line x1="985" y1="385" x2="1330" y2="385" stroke="#fff" stroke-opacity=".09"/><text x="988" y="415" class="B">Cursor position sets the launch direction.</text><text x="988" y="440" class="M">Aim beside Yellow, not directly on top of it.</text><g transform="translate(1000 472)"><circle cx="0" cy="0" r="17" fill="#ff6489"/><circle cx="55" cy="0" r="17" fill="#ffe56d"/><circle cx="110" cy="0" r="17" fill="#64dcff"/><text x="0" y="6" class="K C">1</text><text x="55" y="6" class="K C">2</text><text x="110" y="6" class="K C">3X</text><path d="M20 0h15M75 0h15" stroke="#fff" stroke-width="3"/></g><text x="1140" y="478" class="M">3X Prism = reward + switch</text>
<!-- objectives -->
<rect x="45" y="525" width="1310" height="175" rx="28" fill="#081020" stroke="#fff" stroke-opacity=".16"/><text x="72" y="563" class="L">CONQUEST PATH</text><text x="72" y="590" class="M">Destroy all four outer landmarks, then build at least 28% town chaos to drop Town Hall's final shield.</text>
<g transform="translate(72 612)"><g><rect width="132" height="58" rx="13" fill="#24162a" stroke="#ff829f"/><text x="66" y="26" class="B C">BAKERY</text><text x="66" y="46" class="M C">smash</text></g><path d="M140 29h24" stroke="#8293b2" stroke-width="3"/><g transform="translate(172)"><rect width="132" height="58" rx="13" fill="#2b2215" stroke="#ffd46d"/><text x="66" y="26" class="B C">MARKET</text><text x="66" y="46" class="M C">powerups</text></g><path d="M312 29h24" stroke="#8293b2" stroke-width="3"/><g transform="translate(344)"><rect width="146" height="58" rx="13" fill="#13251c" stroke="#74e5a1"/><text x="73" y="26" class="B C">GREENHOUSE</text><text x="73" y="46" class="M C">territory</text></g><path d="M498 29h24" stroke="#8293b2" stroke-width="3"/><g transform="translate(530)"><rect width="132" height="58" rx="13" fill="#142334" stroke="#78cfff"/><text x="66" y="26" class="B C">CLOCK</text><text x="66" y="46" class="M C">anger</text></g><path d="M670 29h24" stroke="#8293b2" stroke-width="3"/><g transform="translate(702)"><rect width="176" height="58" rx="13" fill="#1d263d" stroke="#a785ff"/><text x="88" y="25" class="B C">28% CHAOS</text><text x="88" y="45" class="M C">paint + damage</text></g><path d="M886 29h24" stroke="#8293b2" stroke-width="3"/><g transform="translate(918)"><rect width="190" height="58" rx="13" fill="#302514" stroke="#ffe56d" stroke-width="2"/><text x="95" y="25" class="P C" style="font-size:20px">TOWN HALL</text><text x="95" y="46" class="M C">finish the conquest</text></g></g>
<!-- competitive -->
<rect x="45" y="724" width="1310" height="105" rx="25" fill="#090d1b" stroke="url(#r)" stroke-width="2"/><text x="72" y="758" class="L">CLIMB THE SCOREBOARD</text><text x="72" y="786" class="B">Go faster • paint more • destroy more • chain Prisms • keep the herd ACTIVE • stun cleanup</text><text x="72" y="812" class="M">Prismborough → Washwater Bay → Cloudtop Heights → Stampede+ • harder worlds multiply the same skill score</text><g transform="translate(1080 753)"><text x="0" y="0" class="M">LOW</text><text x="0" y="22" class="M">MEDIUM</text><text x="88" y="0" class="M">HIGH</text><text x="88" y="22" class="M">HIGHER</text><text x="178" y="11" class="B" style="fill:#ffe56d">HIGHEST</text></g>
<text x="700" y="850" class="M C">The best run is controlled chaos: make a plan, leave it running, intervene elsewhere, then cash in the consequences.</text>
</svg>
