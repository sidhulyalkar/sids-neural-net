 <linearGradient id="r" x1="0" x2="1"><stop stop-color="#ff6489"/><stop offset=".25" stop-color="#ffe56d"/><stop offset=".5" stop-color="#73eda0"/><stop offset=".75" stop-color="#64dcff"/><stop offset="1" stop-color="#d782ff"/></linearGradient>
 <filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>.H{font:800 50px system-ui,sans-serif;fill:#fff}.S{font:600 19px system-ui,sans-serif;fill:#cbd6ef}.L{font:800 13px system-ui,sans-serif;letter-spacing:1.5px;fill:#9fb0d2}.P{font:800 24px system-ui,sans-serif;fill:#fff}.B{font:600 16px system-ui,sans-serif;fill:#e2eaff}.M{font:600 13px system-ui,sans-serif;fill:#b5c2dc}.N{font:900 29px system-ui,sans-serif;fill:#fff}.K{font:800 20px system-ui,sans-serif;fill:#071120}.C{text-anchor:middle}.R{stroke-linecap:round;stroke-linejoin:round}</style>
</defs>
<rect width="1400" height="860" fill="url(#bg)"/><circle cx="1270" cy="70" r="140" fill="#ff6489" opacity=".045"/><circle cx="1350" cy="170" r="150" fill="#64dcff" opacity=".035"/>
<text x="58" y="68" class="H">UNICORN STAMPEDE</text><text x="60" y="103" class="S">Control two. Leave four working. Build chaos fast enough to climb the scoreboard.</text>
<!-- blue -->
<rect x="45" y="135" width="395" height="365" rx="28" fill="url(#p)" stroke="#73dfff" stroke-width="2"/>
<text x="72" y="174" class="L">BLUE ROSTER • ROUTE PLANNING</text><text x="72" y="210" class="P">STEER → RELEASE → NEXT</text>
